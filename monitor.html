<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0F1C2E">
<title>Layar Kelas — An Nashir Islamic School</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<style>
  body.board-page {
    background-color: #0F1C2E;
    color: #F8FAFC;
    font-family: 'Plus Jakarta Sans', sans-serif;
    min-height: 100vh;
    margin: 0;
  }

  /* Login Card */
  .login-card {
    max-width: 400px;
    margin: 0 auto;
    background: #1E293B;
    border: 1px solid #334155;
    padding: 32px;
    border-radius: 24px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  }

  .lock-icon {
    font-size: 40px;
    text-align: center;
    margin-bottom: 12px;
  }

  /* Topbar */
  .board-topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    background: #0F1C2E;
    border-bottom: 2px solid #1E293B;
  }

  .board-clock {
    font-size: 32px;
    font-weight: 800;
    color: #F59E0B;
    font-variant-numeric: tabular-nums;
  }

  .board-content {
    padding: 24px;
  }

  .board-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
  }

  /* Call Cards */
  .call-card {
    background: #1E293B;
    border: 2px solid #334155;
    border-radius: 16px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 180px;
    transition: all 0.3s ease;
    position: relative;
  }

  /* Status Called / Dipanggil (Paling Kiri / Paling Atas) */
  .call-card.called {
    background: linear-gradient(135deg, #065F46 0%, #047857 100%);
    border: 3px solid #34D399;
    box-shadow: 0 0 25px rgba(52, 211, 153, 0.4);
    animation: pulseGlow 2s infinite alternate;
  }

  @keyframes pulseGlow {
    0% { transform: scale(1); box-shadow: 0 0 15px rgba(52, 211, 153, 0.3); }
    100% { transform: scale(1.02); box-shadow: 0 0 35px rgba(52, 211, 153, 0.6); }
  }

  .call-card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
  }

  .class-badge {
    background: #0F1C2E;
    color: #38BDF8;
    padding: 4px 12px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 800;
    border: 1px solid #334155;
  }

  .call-card.called .class-badge {
    background: #022C22;
    color: #34D399;
    border-color: #059669;
  }

  .called-tag {
    background: #022C22;
    color: #6EE7B7;
    border: 1px solid #059669;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
  }

  .waiting-tag {
    background: #334155;
    color: #94A3B8;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
  }

  .call-name {
    font-size: 24px;
    font-weight: 800;
    color: #FFFFFF;
    line-height: 1.2;
    margin-bottom: 6px;
  }

  .call-meta {
    font-size: 14px;
    color: #94A3B8;
    font-weight: 600;
    margin-bottom: 16px;
  }

  .call-card.called .call-meta {
    color: #A7F3D0;
  }

  /* Buttons */
  .call-done-btn {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .call-out-btn {
    background: #2563EB;
    color: #FFFFFF;
  }
  .call-out-btn:active {
    transform: scale(0.97);
    background: #1D4ED8;
  }

  .done-btn {
    background: #059669;
    color: #FFFFFF;
  }
  .done-btn:active {
    transform: scale(0.97);
    background: #047857;
  }

  .board-empty {
    text-align: center;
    padding: 80px 20px;
    background: #1E293B;
    border-radius: 20px;
    border: 2px dashed #334155;
    color: #94A3B8;
    font-size: 18px;
  }
  .board-empty b {
    display: block;
    font-size: 24px;
    color: #F8FAFC;
    margin-bottom: 8px;
  }
</style>
</head>
<body class="board-page">

<!-- LOGIN GATE -->
<div id="login-wrap" class="login-wrap" style="padding-top:100px;">
  <div class="login-card">
    <div class="lock-icon">🔒</div>
    <div class="admin-title" style="text-align:center;">Masuk Perangkat Layar Kelas</div>
    <div class="admin-sub" style="text-align:center; margin-bottom: 20px;">Login sekali di perangkat TV/monitor ini, lalu biarkan tetap terbuka.</div>
    <input class="text-input" id="login-email" type="email" placeholder="Email guru/admin" style="margin-bottom:12px;">
    <input class="text-input" id="login-pass" type="password" placeholder="Kata sandi" onkeydown="if(event.key==='Enter') doLogin()" style="margin-bottom:12px;">
    <div class="pin-error" id="login-error" style="margin-bottom:12px; color:#EF4444; text-align:center;"></div>
    <button class="sheet-btn" onclick="doLogin()">Masuk</button>
  </div>
</div>

<!-- BOARD -->
<div id="board-wrap" style="display:none;">
  <div class="topbar board-topbar">
    <div class="topbar-brand">
      <div class="topbar-logo" style="width:48px;height:48px;"><img src="logo.png" alt="Logo"></div>
      <div>
        <div class="topbar-name">Papan Penjemputan</div>
        <div class="topbar-sub">An Nashir Islamic School (SD) · Live</div>
      </div>
    </div>
    <div class="board-clock" id="clock">--:--</div>
  </div>
  <div class="board-content" id="board-content"></div>
</div>

<script type="module">
import { watchAdminSession, adminLogin, listenQueue, markCalled, markPickupDone } from "./firebase-config.js";

let QUEUE = [];
let unsubQueue = null;

window.doLogin = async function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent='';
  if(!email || !pass){ errEl.textContent='Email dan kata sandi wajib diisi.'; return; }
  try{
    await adminLogin(email, pass);
  }catch(e){
    errEl.textContent = 'Email atau kata sandi salah.';
  }
}

watchAdminSession((user)=>{
  const loginWrap = document.getElementById('login-wrap');
  const boardWrap = document.getElementById('board-wrap');
  if(user){
    loginWrap.style.display='none';
    boardWrap.style.display='block';
    if(!unsubQueue){
      unsubQueue = listenQueue((list)=>{ QUEUE = list; renderBoard(); });
    }
  } else {
    loginWrap.style.display='block';
    boardWrap.style.display='none';
    if(unsubQueue){ unsubQueue(); unsubQueue=null; }
  }
});

function timeAgo(ts){
  if(!ts) return 'baru saja';
  const millis = ts.toMillis ? ts.toMillis() : (ts.seconds ? ts.seconds * 1000 : new Date(ts).getTime());
  const mins = Math.max(0, Math.floor((Date.now()-millis)/60000));
  if(mins<1) return 'baru saja';
  return `${mins} menit lalu`;
}

function getTimestamp(q){
  // Prioritas timestamp: waktu dipanggil (calledAt) -> waktu datang (time) -> 0
  const t = q.calledAt || q.time;
  if(!t) return 0;
  return t.toMillis ? t.toMillis() : (t.seconds ? t.seconds * 1000 : new Date(t).getTime());
}

function renderBoard(){
  const el = document.getElementById('board-content');
  
  // 1. Ambil HANYA status 'waiting' dan 'called' (Abaikan 'done' / 'completed')
  const activeQueue = QUEUE.filter(q => q.status === 'waiting' || q.status === 'called');

  // 2. LOGIKA SORTING KETAT & TERPERINCI
  activeQueue.sort((a, b) => {
    const isACalled = a.status === 'called';
    const isBCalled = b.status === 'called';

    // Aturan 1: 'called' SELALU di sebelah kiri/atas daripada 'waiting'
    if (isACalled && !isBCalled) return -1;
    if (!isACalled && isBCalled) return 1;

    // Aturan 2: Jika sama-sama 'called', yang dipanggil TERBARU ada di PALING KIRI (teratas)
    // Aturan 3: Jika sama-sama 'waiting', yang datang TERBARU ada di KIRI
    const timeA = getTimestamp(a);
    const timeB = getTimestamp(b);
    return timeB - timeA; // Descending (Terbaru = Nilai terbesar = Paling Kiri)
  });

  if(activeQueue.length === 0){
    el.innerHTML = `<div class="board-empty"><b>Papan Kosong</b>Belum ada penjemputan yang aktif saat ini.</div>`;
    return;
  }

  el.innerHTML = `<div class="board-grid">
    ${activeQueue.map(q => {
      const called = q.status === 'called';
      const cardClass = called ? 'called' : '';
      const actionBtn = called
        ? `<button class="call-done-btn done-btn" onclick="doMarkDone('${q.id}')">✓ Selesai — Anak Diserahkan</button>`
        : `<button class="call-done-btn call-out-btn" onclick="doMarkCalled('${q.id}')">📢 Panggil Keluar</button>`;
      
      const statusBadge = called 
        ? `<span class="called-tag">🔔 DIPANGGIL</span>` 
        : `<span class="waiting-tag">⏳ MENUNGGU</span>`;
      
      return `
      <div class="call-card ${cardClass}">
        <div>
          <div class="call-card-top">
            ${statusBadge}
            <span class="class-badge">Kelas ${q.class}</span>
          </div>
          <div class="call-name">${q.name}</div>
          <div class="call-meta">Penjemput: <b>${q.picker || '—'}</b> · ${timeAgo(q.time)}</div>
        </div>
        ${actionBtn}
      </div>`;
    }).join('')}
  </div>`;
}

window.doMarkCalled = async function doMarkCalled(id){
  try{
    await markCalled(id);
  }catch(e){
    alert('Gagal menandai dipanggil, coba lagi.');
  }
}

window.doMarkDone = async function doMarkDone(id){
  try{
    await markPickupDone(id);
  }catch(e){
    alert('Gagal menandai selesai, coba lagi.');
  }
}

function tickClock(){
  const d = new Date();
  document.getElementById('clock').textContent = d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
}
setInterval(tickClock, 1000); tickClock();
setInterval(()=>{ if(document.getElementById('board-wrap').style.display!=='none') renderBoard(); }, 10000);
</script>
</body>
</html>
