<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papan Penjemputan — An Nashir Islamic School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-color: #0d1520;
    --card-bg: #064e3b;
    --card-border: #10b981;
    --text-main: #ffffff;
    --text-sub: #a7f3d0;
    --accent-yellow: #f59e0b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg-color);
    color: var(--text-main);
    font-family: 'Plus Jakarta Sans', sans-serif;
    min-height: 100vh;
    padding: 24px;
  }

  /* Header Header & Jam */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .brand { display: flex; align-items: center; gap: 16px; }
  .logo { width: 50px; height: 50px; object-fit: contain; }
  .title { font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700; }
  .subtitle { font-size: 14px; color: #94a3b8; font-weight: 600; letter-spacing: 1px; }

  .clock-box { text-align: right; }
  .date-str { font-size: 14px; color: #94a3b8; font-weight: 600; }
  .time-str { font-family: 'Space Grotesk', sans-serif; font-size: 36px; font-weight: 700; color: var(--accent-yellow); line-height: 1; }

  /* FILTER BAR KELAS (Semua, P1 - P6) */
  .filter-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
    background: rgba(255, 255, 255, 0.05);
    padding: 8px 12px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    overflow-x: auto;
  }
  .filter-btn {
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #cbd5e1;
    padding: 8px 20px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .filter-btn:hover {
    background: rgba(255, 255, 255, 0.1);
    color: #ffffff;
  }
  .filter-btn.active {
    background: #10b981;
    color: #ffffff;
    border-color: #10b981;
    box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
  }

  /* Grid Kartu Monitor */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 20px;
  }

  .card {
    background: linear-gradient(135deg, #064e3b 0%, #022c22 100%);
    border: 2px solid var(--card-border);
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    animation: fadeIn 0.3s ease-out;
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .badge-dipanggil {
    background: rgba(245, 158, 11, 0.2);
    color: var(--accent-yellow);
    border: 1px solid var(--accent-yellow);
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .badge-kelas {
    background: rgba(0,0,0,0.4);
    color: #ffffff;
    padding: 4px 12px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
  }

  .student-name {
    font-size: 24px;
    font-weight: 800;
    color: #ffffff;
    margin-bottom: 8px;
    line-height: 1.2;
  }
  .picker-info {
    font-size: 15px;
    color: var(--text-sub);
    margin-bottom: 16px;
  }

  .btn-action {
    width: 100%;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(16, 185, 129, 0.5);
    color: #a7f3d0;
    padding: 10px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 14px;
    text-align: center;
  }

  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px;
    color: #64748b;
    font-size: 18px;
    font-weight: 600;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(100px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="header">
  <div class="brand">
    <img src="logo.png" alt="Logo" class="logo">
    <div>
      <div class="title">Papan Penjemputan</div>
      <div class="subtitle">AN NASHIR ISLAMIC SCHOOL (SD) · LIVE</div>
    </div>
  </div>
  <div class="clock-box">
    <div class="date-str" id="date-str">--</div>
    <div class="time-str" id="time-str">--:--</div>
  </div>
</div>

<!-- FILTER BAR KELAS -->
<div class="filter-bar">
  <button class="filter-btn active" onclick="setFilter('ALL', this)">Semua Kelas</button>
  <button class="filter-btn" onclick="setFilter('P1', this)">Kelas P1</button>
  <button class="filter-btn" onclick="setFilter('P2', this)">Kelas P2</button>
  <button class="filter-btn" onclick="setFilter('P3', this)">Kelas P3</button>
  <button class="filter-btn" onclick="setFilter('P4', this)">Kelas P4</button>
  <button class="filter-btn" onclick="setFilter('P5', this)">Kelas P5</button>
  <button class="filter-btn" onclick="setFilter('P6', this)">Kelas P6</button>
</div>

<!-- CONTAINER KARTU DIPANGGIL -->
<div class="grid" id="monitor-grid">
  <div class="empty-state">Memuat antrean penjemputan…</div>
</div>

<script type="module">
import { listenQueue } from "./firebase-config.js";

let currentQueue = [];
let selectedClassFilter = 'ALL';

// Update Jam & Tanggal
function updateClock() {
  const now = new Date();
  const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
  document.getElementById('date-str').textContent = now.toLocaleDateString('id-ID', dateOptions);
  
  const hours = String(now.getHours()).padStart(2, '0');
  const minutes = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('time-str').textContent = `${hours}.${minutes}`;
}
setInterval(updateClock, 1000);
updateClock();

// Set Filter Kelas
window.setFilter = function(cls, btn) {
  selectedClassFilter = cls;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderQueue();
}

// Listen Antrean Realtime
listenQueue((data) => {
  currentQueue = data || [];
  renderQueue();
});

function renderQueue() {
  const grid = document.getElementById('monitor-grid');
  
  // Filter berdasarkan kelas yang dipilih
  let filtered = [...currentQueue];
  if (selectedClassFilter !== 'ALL') {
    filtered = filtered.filter(item => String(item.class).toUpperCase().includes(selectedClassFilter));
  }

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-state">Tidak ada antrean panggilan ${selectedClassFilter === 'ALL' ? '' : 'untuk Kelas ' + selectedClassFilter}.</div>`;
    return;
  }

  grid.innerHTML = filtered.map(item => `
    <div class="card">
      <div>
        <div class="card-top">
          <div class="badge-dipanggil">🔔 DIPANGGIL</div>
          <div class="badge-kelas">Kelas ${item.class}</div>
        </div>
        <div class="student-name">${item.name}</div>
        <div class="picker-info">Penjemput: <b>${item.pickerName || 'Orang Tua'}</b> · ${getTimeAgo(item.timestamp)}</div>
      </div>
      <div class="btn-action">✓ Sudah Dipanggil</div>
    </div>
  `).join('');
}

function getTimeAgo(timestamp) {
  if (!timestamp) return 'baru saja';
  const seconds = Math.floor((new Date() - new Date(timestamp)) / 1000);
  if (seconds < 60) return 'baru saja';
  const minutes = Math.floor(seconds / 60);
  return `${minutes} menit lalu`;
}
</script>

</body>
</html>
