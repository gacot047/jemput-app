<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0F1C2E">
<title>Layar Kelas — An Nashir Islamic School</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<style>
  body.board-page {
    background-color: #0F1C2E;
    color: #F8FAFC;
    font-family: 'Plus Jakarta Sans', sans-serif;
    min-height: 100vh;
    margin: 0;
  }

  .login-card {
    max-width: 400px;
    margin: 0 auto;
    background: #1E293B;
    border: 1px solid #334155;
    padding: 32px;
    border-radius: 24px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  }

  .lock-icon {
    font-size: 40px;
    text-align: center;
    margin-bottom: 12px;
  }

  .board-topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    background: #0F1C2E;
    border-bottom: 2px solid #1E293B;
  }

  /* WRAPPER JAM & TANGGAL */
  .clock-wrapper {
    text-align: right;
  }

  .board-date {
    font-size: 14px;
    font-weight: 700;
    color: #94A3B8;
    text-transform: capitalize;
    margin-bottom: 2px;
  }

  .board-clock {
    font-size: 32px;
    font-weight: 800;
    color: #F59E0B;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }

  .board-content {
    padding: 24px;
  }

  .board-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
  }

  .call-card {
    background: #1E293B;
    border: 2px solid #334155;
    border-radius: 16px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 180px;
    transition: all 0.3s ease;
    position: relative;
  }

  /* KARTU DIPANGGIL (Hijau) */
  .call-card.called {
    background: linear-gradient(135deg, #065F46 0%, #047857 100%);
    border: 3px solid #34D399;
    box-shadow: 0 0 25px rgba(52, 211, 153, 0.4);
  }

  /* KARTU MENUNGGU (Biru) */
  .call-card.waiting {
    background: #1E293B;
    border: 2px solid #2563EB;
    box-shadow: 0 0 15px rgba(37, 99, 235, 0.3);
  }

  .call-card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
  }

  .class-badge {
    background: #0F1C2E;
    color: #38BDF8;
    padding: 4px 12px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 800;
    border: 1px solid #334155;
  }

  .call-card.called .class-badge {
    background: #022C22;
    color: #34D399;
    border-color: #059669;
  }

  .called-tag {
    background: #022C22;
    color: #6EE7B7;
    border: 1px solid #059669;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
  }

  .waiting-tag {
    background: #1E3A8A;
    color: #93C5FD;
    border: 1px solid #2563EB;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
  }

  .call-name {
    font-size: 24px;
    font-weight: 800;
    color: #FFFFFF;
    line-height: 1.2;
    margin-bottom: 6px;
  }

  .call-meta {
    font-size: 14px;
    color: #94A3B8;
    font-weight: 600;
    margin-bottom: 16px;
  }

  .call-card.called .call-meta {
    color: #A7F3D0;
  }

  .call-done-btn {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .call-out-btn {
    background: #2563EB;
    color: #FFFFFF;
  }
  .call-out-btn:active {
    transform: scale(0.97);
    background: #1D4ED8;
  }

  .done-btn {
    background: #059669;
    color: #FFFFFF;
  }
  .done-btn:active {
    transform: scale(0.97);
    background: #047857;
  }

  .board-empty {
    text-align: center;
    padding: 80px 20px;
    background: #1E293B;
    border-radius: 20px;
    border: 2px dashed #334155;
    color: #94A3B8;
    font-size: 18px;
  }
</style>
</head>
<body class="board-page">

<!-- LOGIN GATE -->
<div id="login-wrap" class="login-wrap" style="padding-top:100px;">
  <div class="login-card">
    <div class="lock-icon">🔒</div>
    <div class="admin-title" style="text-align:center;">Masuk Perangkat Layar Kelas</div>
    <div class="admin-sub" style="text-align:center; margin-bottom: 20px;">Login sekali di perangkat TV/monitor ini, lalu biarkan tetap terbuka.</div>
    <input class="text-input" id="login-email" type="email" placeholder="Email guru/admin" style="margin-bottom:12px;">
    <input class="text-input" id="login-pass" type="password" placeholder="Kata sandi" onkeydown="if(event.key==='Enter') doLogin()" style="margin-bottom:12px;">
    <div class="pin-error" id="login-error" style="margin-bottom:12px; color:#EF4444; text-align:center;"></div>
    <button class="sheet-btn" onclick="doLogin()">Masuk</button>
  </div>
</div>

<!-- BOARD -->
<div id="board-wrap" style="display:none;">
  <div class="topbar board-topbar">
    <div class="topbar-brand">
      <div class="topbar-logo" style="width:48px;height:48px;"><img src="logo.png" alt="Logo"></div>
      <div>
        <div class="topbar-name">Papan Penjemputan</div>
        <div class="topbar-sub">An Nashir Islamic School (SD) · Live</div>
      </div>
    </div>
    
    <!-- 🎯 BAGIAN HEADER DIUBAH DI SINI -->
    <div class="clock-wrapper">
      <div class="board-date" id="date-display">Senin, 27 Juli 2026</div>
      <div class="board-clock" id="clock">--:--</div>
    </div>
  </div>
  
  <div class="board-content" id="board-content"></div>
</div>

<script type="module">
import { watchAdminSession, adminLogin, listenQueue, markCalled, markPickupDone } from "./firebase-config.js";

let QUEUE = [];
let unsubQueue = null;

window.doLogin = async function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent='';
  if(!email || !pass){ errEl.textContent='Email dan kata sandi wajib diisi.'; return; }
  try{
    await adminLogin(email, pass);
  }catch(e){
    errEl.textContent = 'Email atau kata sandi salah.';
  }
}

watchAdminSession((user)=>{
  const loginWrap = document.getElementById('login-wrap');
  const boardWrap = document.getElementById('board-wrap');
  if(user){
    loginWrap.style.display='none';
    boardWrap.style.display='block';
    if(!unsubQueue){
      unsubQueue = listenQueue((list)=>{ QUEUE = list; renderBoard(); });
    }
  } else {
    loginWrap.style.display='block';
    boardWrap.style.display='none';
    if(unsubQueue){ unsubQueue(); unsubQueue=null; }
  }
});

function parseTime(val) {
  if (!val) return 0;
  if (typeof val === 'number') return val;
  if (val.toMillis) return val.toMillis();
  if (val.seconds) return val.seconds * 1000;
  return new Date(val).getTime() || 0;
}

function timeAgo(item){
  const t = parseTime(item.time);
  if(!t) return 'baru saja';
  const mins = Math.max(0, Math.floor((Date.now() - t) / 60000));
  if(mins < 1) return 'baru saja';
  return `${mins} menit lalu`;
}

function renderBoard(){
  const el = document.getElementById('board-content');
  
  const activeQueue = QUEUE.filter(q => q.status === 'waiting' || q.status === 'called');

  activeQueue.sort((a, b) => {
    const isAWaiting = a.status === 'waiting';
    const isBWaiting = b.status === 'waiting';

    if (isAWaiting && !isBWaiting) return -1;
    if (!isAWaiting && isBWaiting) return 1;

    const timeA = parseTime(a.calledAt) || parseTime(a.time);
    const timeB = parseTime(b.calledAt) || parseTime(b.time);
    return timeB - timeA;
  });

  if(activeQueue.length === 0){
    el.innerHTML = `<div class="board-empty"><b>Papan Kosong</b>Belum ada penjemputan yang aktif saat ini.</div>`;
    return;
  }

  el.innerHTML = `<div class="board-grid">
    ${activeQueue.map(q => {
      const isCalled = q.status === 'called';
      const cardClass = isCalled ? 'called' : 'waiting';
      const actionBtn = isCalled
        ? `<button class="call-done-btn done-btn" onclick="doMarkDone('${q.id}')">✓ Selesai — Anak Diserahkan</button>`
        : `<button class="call-done-btn call-out-btn" onclick="doMarkCalled('${q.id}')">📢 Panggil Keluar</button>`;
      
      const statusBadge = isCalled 
        ? `<span class="called-tag">🔔 DIPANGGIL</span>` 
        : `<span class="waiting-tag">⏳ MENUNGGU</span>`;
      
      return `
      <div class="call-card ${cardClass}">
        <div>
          <div class="call-card-top">
            ${statusBadge}
            <span class="class-badge">Kelas ${q.class}</span>
          </div>
          <div class="call-name">${q.name}</div>
          <div class="call-meta">Penjemput: <b>${q.picker || '—'}</b> · ${timeAgo(q)}</div>
        </div>
        ${actionBtn}
      </div>`;
    }).join('')}
  </div>`;
}

window.doMarkCalled = async function doMarkCalled(id){
  try{
    const target = QUEUE.find(q => q.id === id);
    if (target) {
      target.status = 'called';
      target.calledAt = Date.now();
      renderBoard();
    }
    await markCalled(id);
  }catch(e){
    alert('Gagal menandai dipanggil, coba lagi.');
  }
}

window.doMarkDone = async function doMarkDone(id){
  try{
    QUEUE = QUEUE.filter(q => q.id !== id);
    renderBoard();
    await markPickupDone(id);
  }catch(e){
    alert('Gagal menandai selesai, coba lagi.');
  }
}

// 🎯 FUNGSI JAM & TANGGAL OTOMATIS
function tickClock(){
  const d = new Date();
  
  // Format Hari, Tanggal Bulan Tahun
  const optionsDate = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
  const formattedDate = d.toLocaleDateString('id-ID', optionsDate);
  
  // Format Jam & Menit
  const hours = String(d.getHours()).padStart(2, '0');
  const minutes = String(d.getMinutes()).padStart(2, '0');
  const formattedTime = `${hours}.${minutes}`;
  
  const dateEl = document.getElementById('date-display');
  const clockEl = document.getElementById('clock');
  
  if (dateEl) dateEl.textContent = formattedDate;
  if (clockEl) clockEl.textContent = formattedTime;
}

setInterval(tickClock, 1000); 
tickClock();
</script>
</body>
</html>
