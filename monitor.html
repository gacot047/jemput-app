<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papan Penjemputan — An Nashir Islamic School</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    background-color: #0F1C2E;
    color: #F8FAFC;
    font-family: 'Plus Jakarta Sans', sans-serif;
    min-height: 100vh;
    padding: 24px;
    overflow-x: hidden;
  }

  /* Header Monitor */
  .monitor-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 20px;
    border-bottom: 2px solid #1E293B;
    margin-bottom: 24px;
  }
  .brand-box {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .brand-logo {
    width: 56px;
    height: 56px;
    object-fit: contain;
  }
  .brand-title {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }
  .brand-sub {
    font-size: 14px;
    color: #38BDF8;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .clock-box {
    font-size: 36px;
    font-weight: 800;
    color: #F59E0B;
    font-variant-numeric: tabular-nums;
  }

  /* Grid Layout Monitor */
  .queue-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
  }

  /* Kartu Antrean Biasa (Waiting) */
  .monitor-card {
    background: #1E293B;
    border: 2px solid #334155;
    border-radius: 16px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 160px;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  /* Highlight Kartu Panggilan (CALLED) - Super Mencolok */
  .monitor-card.called {
    background: linear-gradient(135deg, #065F46 0%, #047857 100%);
    border: 3px solid #34D399;
    box-shadow: 0 0 25px rgba(52, 211, 153, 0.4);
    animation: pulseGlow 2s infinite alternate;
  }

  @keyframes pulseGlow {
    0% {
      transform: scale(1);
      box-shadow: 0 0 15px rgba(52, 211, 153, 0.3);
    }
    100% {
      transform: scale(1.02);
      box-shadow: 0 0 35px rgba(52, 211, 153, 0.7);
    }
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .monitor-card .status-badge {
    background: #334155;
    color: #94A3B8;
  }
  .monitor-card.called .status-badge {
    background: #022C22;
    color: #6EE7B7;
    border: 1px solid #059669;
  }

  .class-badge {
    background: #0F1C2E;
    color: #38BDF8;
    padding: 6px 14px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 800;
    border: 1px solid #1E293B;
  }
  .monitor-card.called .class-badge {
    background: #022C22;
    color: #34D399;
    border-color: #059669;
  }

  .student-name {
    font-size: 24px;
    font-weight: 800;
    line-height: 1.2;
    color: #FFFFFF;
    margin-bottom: 8px;
  }
  .monitor-card.called .student-name {
    font-size: 28px;
    color: #FFFFFF;
    text-shadow: 0 2px 4px rgba(0,0,0,0.3);
  }

  .picker-info {
    font-size: 14px;
    color: #94A3B8;
    font-weight: 600;
  }
  .monitor-card.called .picker-info {
    color: #A7F3D0;
  }

  /* Empty State */
  .empty-monitor {
    grid-column: 1 / -1;
    text-align: center;
    padding: 80px 20px;
    background: #1E293B;
    border-radius: 20px;
    border: 2px dashed #334155;
  }
  .empty-icon {
    font-size: 56px;
    margin-bottom: 16px;
  }
  .empty-title {
    font-size: 22px;
    font-weight: 700;
    color: #94A3B8;
  }
</style>
</head>
<body>

<div class="monitor-header">
  <div class="brand-box">
    <img src="logo.png" alt="Logo" class="brand-logo">
    <div>
      <div class="brand-title">Papan Penjemputan</div>
      <div class="brand-sub">AN NASHIR ISLAMIC SCHOOL (SD) · LIVE</div>
    </div>
  </div>
  <div class="clock-box" id="clock">00:00</div>
</div>

<div class="queue-grid" id="queue-grid">
  <div class="empty-monitor">
    <div class="empty-icon">☕</div>
    <div class="empty-title">Belum ada antrean penjemputan saat ini</div>
  </div>
</div>

<script type="module">
  import { listenQueue } from "./firebase-config.js";

  // Clock Update
  function updateClock() {
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('clock').textContent = `${hours}:${minutes}`;
  }
  setInterval(updateClock, 1000);
  updateClock();

  // Real-time Listener Queue
  listenQueue((list) => {
    // 1. Filter HANYA dokumen yang aktif ('waiting' dan 'called')
    const activeQueue = list.filter(q => q.status === 'waiting' || q.status === 'called');

    // Helper untuk mengambil timestamp/milisekon terakurat
    const getTime = (item) => {
      // Prioritaskan calledAt (waktu dipanggil), jika tidak ada pakai time (waktu daftar)
      const t = item.calledAt || item.time;
      if (!t) return 0;
      return t.toMillis ? t.toMillis() : (t.seconds ? t.seconds * 1000 : new Date(t).getTime());
    };

    // 2. SORTING KETAT:
    // - Status 'called' HARUS ada di depan 'waiting'
    // - Jika sesama 'called' atau sesama 'waiting': YANG TERBARU (timestamp lebih besar) TAMPIL LEBIH DULU (paling kiri)
    activeQueue.sort((a, b) => {
      const isACalled = a.status === 'called';
      const isBCalled = b.status === 'called';

      if (isACalled && !isBCalled) return -1; // a ke paling depan (kiri)
      if (!isACalled && isBCalled) return 1;  // b ke paling depan (kiri)

      // Jika statusnya sama, urutkan dari yang terbaru (Descending)
      return getTime(b) - getTime(a);
    });

    renderQueue(activeQueue);
  });

  function renderQueue(items) {
    const grid = document.getElementById('queue-grid');

    if (items.length === 0) {
      grid.innerHTML = `
        <div class="empty-monitor">
          <div class="empty-icon">☕</div>
          <div class="empty-title">Belum ada antrean penjemputan saat ini</div>
        </div>
      `;
      return;
    }

    grid.innerHTML = items.map(item => {
      const isCalled = item.status === 'called';
      const statusLabel = isCalled ? '🔔 SILAKAN KELUAR' : '⏳ MENUNGGU';
      
      return `
        <div class="monitor-card ${isCalled ? 'called' : ''}">
          <div>
            <div class="card-top">
              <span class="status-badge">${statusLabel}</span>
              <span class="class-badge">Kelas ${item.class}</span>
            </div>
            <div class="student-name">${item.name}</div>
          </div>
          <div class="picker-info">
            Penjemput: <b>${item.picker || '—'}</b>
          </div>
        </div>
      `;
    }).join('');
  }
</script>

</body>
</html>
