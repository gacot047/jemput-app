<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papan Penjemputan — An Nashir Islamic School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-color: #0b131e;
    
    /* Kartu Menunggu (High Priority) */
    --card-waiting-bg: linear-gradient(145deg, #1e1b12 0%, #14110b 100%);
    --card-waiting-border: #f59e0b;
    --card-waiting-glow: rgba(245, 158, 11, 0.25);
    
    /* Kartu Dipanggil (Muted / Low Priority) */
    --card-called-bg: #111a26;
    --card-called-border: rgba(16, 185, 129, 0.25);
    
    --text-main: #ffffff;
    --text-sub: #94a3b8;
    --accent-yellow: #fbbf24;
    --accent-green: #10b981;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg-color);
    color: var(--text-main);
    font-family: 'Plus Jakarta Sans', sans-serif;
    min-height: 100vh;
    padding: 24px;
  }

  /* ---------- LOGIN GATE ---------- */
  .login-wrap{display:flex;justify-content:center;align-items:center;min-height:90vh;}
  .login-card{width:100%;max-width:360px;background:#0f2136;border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:32px 26px;text-align:center;}
  .lock-icon{width:52px;height:52px;border-radius:50%;background:rgba(245,158,11,.15);color:var(--accent-yellow);display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 14px;}
  .login-title{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;margin-bottom:4px;}
  .login-sub{font-size:13px;color:#94a3b8;margin-bottom:18px;}
  .login-input{width:100%;padding:11px 13px;margin-top:10px;border:1.5px solid rgba(255,255,255,.15);border-radius:10px;background:rgba(255,255,255,.05);color:#fff;font-size:14px;font-family:inherit;outline:none;}
  .login-input:focus{border-color:var(--accent-green);}
  .login-btn{width:100%;margin-top:16px;padding:12px;border:none;border-radius:10px;background:#10b981;color:#fff;font-weight:700;font-size:14.5px;cursor:pointer;}
  .login-error{color:#f87171;font-size:12.5px;font-weight:600;min-height:16px;margin-top:10px;}

  /* Header & Jam */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    background: rgba(255, 255, 255, 0.03);
    padding: 16px 20px;
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.06);
  }
  .brand { display: flex; align-items: center; gap: 16px; }
  .logo { width: 54px; height: 54px; object-fit: contain; border-radius:50%; }
  .title { font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
  .subtitle { font-size: 13px; color: #64748b; font-weight: 700; letter-spacing: 1px; margin-top: 2px; }

  .clock-box { text-align: right; }
  .date-str { font-size: 13px; color: #94a3b8; font-weight: 600; margin-bottom: 2px; }
  .time-str { 
    font-family: 'Space Grotesk', sans-serif; 
    font-size: 42px; 
    font-weight: 800; 
    color: var(--accent-yellow); 
    line-height: 1;
    letter-spacing: -1px;
  }

  /* FILTER BAR KELAS */
  .filter-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
    background: rgba(255, 255, 255, 0.03);
    padding: 8px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.06);
    overflow-x: auto;
  }
  .filter-btn {
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #94a3b8;
    padding: 8px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .filter-btn:hover {
    background: rgba(255, 255, 255, 0.08);
    color: #ffffff;
  }
  .filter-btn.active {
    background: var(--accent-green);
    color: #ffffff;
    border-color: var(--accent-green);
    box-shadow: 0 0 14px rgba(16, 185, 129, 0.35);
  }

  /* Grid Kartu Monitor */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 20px;
  }

  /* KARTU DIPANGGIL (Muted / Selesai) */
  .card {
    background: var(--card-called-bg);
    border: 1.5px solid var(--card-called-border);
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    animation: fadeIn 0.3s ease-out;
    opacity: 0.75;
    transition: all 0.2s ease;
  }
  .card:hover {
    opacity: 0.95;
  }

  /* KARTU MENUNGGU (High Priority / Glow Accent) */
  .card.waiting {
    background: var(--card-waiting-bg);
    border: 2px solid var(--card-waiting-border);
    box-shadow: 0 0 20px var(--card-waiting-glow);
    opacity: 1;
    animation: pulseGlow 3s infinite alternate, fadeIn 0.3s ease-out;
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  
  /* Badges */
  .badge-dipanggil {
    background: rgba(16, 185, 129, 0.12);
    color: #34d399;
    border: 1px solid rgba(16, 185, 129, 0.3);
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .badge-waiting {
    background: rgba(245, 158, 11, 0.18);
    color: #fbbf24;
    border: 1px solid rgba(245, 158, 11, 0.5);
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  /* Badge Warna Kelas Spesifik */
  .badge-kelas {
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.5px;
  }
  .badge-p1 { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
  .badge-p2 { background: rgba(249, 115, 22, 0.2); color: #fdba74; border: 1px solid rgba(249, 115, 22, 0.3); }
  .badge-p3 { background: rgba(234, 179, 8, 0.2); color: #fde047; border: 1px solid rgba(234, 179, 8, 0.3); }
  .badge-p4 { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.3); }
  .badge-p5 { background: rgba(59, 130, 246, 0.2); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.3); }
  .badge-p6 { background: rgba(168, 85, 247, 0.2); color: #d8b4fe; border: 1px solid rgba(168, 85, 247, 0.3); }
  .badge-default { background: rgba(255, 255, 255, 0.1); color: #ffffff; }

  .student-name {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: #ffffff;
    margin-bottom: 6px;
    line-height: 1.25;
    letter-spacing: -0.3px;
  }
  
  .picker-info {
    font-size: 14px;
    color: var(--text-sub);
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .picker-info b {
    color: #e2e8f0;
  }

  .btn-action {
    width: 100%;
    border: none;
    padding: 12px;
    border-radius: 10px;
    font-weight: 800;
    font-size: 14px;
    text-align: center;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s ease;
  }
  .btn-call {
    background: #f59e0b;
    color: #0d1520;
    box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
  }
  .btn-call:hover { 
    background: #d97706; 
    box-shadow: 0 4px 16px rgba(245, 158, 11, 0.45);
    transform: translateY(-1px);
  }

  /* Ringkasan Status Dipanggil */
  .done-status-box {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: rgba(16, 185, 129, 0.08);
    border: 1px solid rgba(16, 185, 129, 0.2);
    border-radius: 8px;
    padding: 8px;
    font-size: 12.5px;
    color: #34d399;
    font-weight: 700;
  }

  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 80px 20px;
    color: #475569;
    font-size: 18px;
    font-weight: 600;
    background: rgba(255, 255, 255, 0.02);
    border-radius: 16px;
    border: 1px dashed rgba(255, 255, 255, 0.06);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes pulseGlow {
    from { box-shadow: 0 0 12px rgba(245, 158, 11, 0.2); }
    to { box-shadow: 0 0 24px rgba(245, 158, 11, 0.45); }
  }
</style>
</head>
<body>

<!-- LOGIN GATE: perangkat TV/monitor login sekali sebagai guru piket -->
<div class="login-wrap" id="login-wrap">
  <div class="login-card">
    <div class="lock-icon">🔒</div>
    <div class="login-title">Masuk Perangkat Layar Kelas</div>
    <div class="login-sub">Login sekali di perangkat ini, lalu biarkan tetap terbuka.</div>
    <input class="login-input" id="login-email" type="email" placeholder="Email guru/admin">
    <input class="login-input" id="login-pass" type="password" placeholder="Kata sandi" onkeydown="if(event.key==='Enter') doLogin()">
    <div class="login-error" id="login-error"></div>
    <button class="login-btn" onclick="doLogin()">Masuk</button>
  </div>
</div>

<!-- BOARD (baru tampil setelah login berhasil) -->
<div id="board-wrap" style="display:none;">
  <div class="header">
    <div class="brand">
      <img src="logo.png" alt="Logo" class="logo">
      <div>
        <div class="title">Papan Penjemputan</div>
        <div class="subtitle">AN NASHIR ISLAMIC SCHOOL (Primary) · LIVE</div>
      </div>
    </div>
    <div class="clock-box">
      <div class="date-str" id="date-str">--</div>
      <div class="time-str" id="time-str">--:--</div>
    </div>
  </div>

  <!-- FILTER BAR KELAS -->
  <div class="filter-bar">
    <button class="filter-btn active" onclick="setFilter('ALL', this)">Semua Kelas</button>
    <button class="filter-btn" onclick="setFilter('P1', this)">Kelas P1</button>
    <button class="filter-btn" onclick="setFilter('P2', this)">Kelas P2</button>
    <button class="filter-btn" onclick="setFilter('P3', this)">Kelas P3</button>
    <button class="filter-btn" onclick="setFilter('P4', this)">Kelas P4</button>
    <button class="filter-btn" onclick="setFilter('P5', this)">Kelas P5</button>
    <button class="filter-btn" onclick="setFilter('P6', this)">Kelas P6</button>
  </div>

  <!-- CONTAINER KARTU -->
  <div class="grid" id="monitor-grid">
    <div class="empty-state">Memuat antrean penjemputan…</div>
  </div>
</div>

<script type="module">
import { watchAdminSession, adminLogin, listenQueue, markCalled } from "./firebase-config.js";

let currentQueue = [];
let selectedClassFilter = 'ALL';
let unsubQueue = null;

/* ---------------- LOGIN ---------------- */
window.doLogin = async function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  if(!email || !pass){ errEl.textContent = 'Email dan kata sandi wajib diisi.'; return; }
  try{
    await adminLogin(email, pass);
  }catch(e){
    errEl.textContent = 'Email atau kata sandi salah.';
  }
}

watchAdminSession((user)=>{
  const loginWrap = document.getElementById('login-wrap');
  const boardWrap = document.getElementById('board-wrap');
  if(user){
    loginWrap.style.display = 'none';
    boardWrap.style.display = 'block';
    if(!unsubQueue){
      unsubQueue = listenQueue((data)=>{ currentQueue = data || []; renderQueue(); });
    }
  } else {
    loginWrap.style.display = 'flex';
    boardWrap.style.display = 'none';
    if(unsubQueue){ unsubQueue(); unsubQueue = null; }
  }
});

/* ---------------- JAM & TANGGAL ---------------- */
function updateClock() {
  const now = new Date();
  const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
  document.getElementById('date-str').textContent = now.toLocaleDateString('id-ID', dateOptions);
  const hours = String(now.getHours()).padStart(2, '0');
  const minutes = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('time-str').textContent = `${hours}.${minutes}`;
}
setInterval(updateClock, 1000);
updateClock();

/* ---------------- FILTER KELAS ---------------- */
window.setFilter = function(cls, btn) {
  selectedClassFilter = cls;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderQueue();
}

/* ---------------- HELPER STYLING BADGE KELAS ---------------- */
function getClassBadgeClass(classStr) {
  if (!classStr) return 'badge-default';
  const c = String(classStr).toUpperCase();
  if (c.includes('P1')) return 'badge-p1';
  if (c.includes('P2')) return 'badge-p2';
  if (c.includes('P3')) return 'badge-p3';
  if (c.includes('P4')) return 'badge-p4';
  if (c.includes('P5')) return 'badge-p5';
  if (c.includes('P6')) return 'badge-p6';
  return 'badge-default';
}

/* ---------------- RENDER PAPAN ---------------- */
function renderQueue() {
  const grid = document.getElementById('monitor-grid');

  let filtered = [...currentQueue];
  if (selectedClassFilter !== 'ALL') {
    filtered = filtered.filter(item => String(item.class).toUpperCase().includes(selectedClassFilter));
  }
  // Yang paling baru muncul di atas
  filtered.sort((a, b) => toMillis(b.time) - toMillis(a.time));

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-state">Tidak ada antrean panggilan ${selectedClassFilter === 'ALL' ? '' : 'untuk Kelas ' + selectedClassFilter}.</div>`;
    return;
  }

  grid.innerHTML = filtered.map(item => {
    const called = item.status === 'called';
    const classBadgeStyle = getClassBadgeClass(item.class);
    return `
    <div class="card ${called ? '' : 'waiting'}">
      <div>
        <div class="card-top">
          ${called
            ? `<div class="badge-dipanggil"><span>✓</span> DIPANGGIL</div>`
            : `<div class="badge-waiting"><span>⏳</span> MENUNGGU</div>`}
          <div class="badge-kelas ${classBadgeStyle}">Kelas ${item.class}</div>
        </div>
        <div class="student-name">${item.name}</div>
        <div class="picker-info">
          <span>Penjemput: <b>${item.picker || 'Orang Tua'}</b></span>
          <span>${getTimeAgo(item.time)}</span>
        </div>
      </div>
      ${called
        ? `<div class="done-status-box">✓ Sudah Dipanggil</div>`
        : `<button class="btn-action btn-call" onclick="doMarkCalled('${item.id}')">📢 Panggil Keluar</button>`}
    </div>
  `;
  }).join('');
}

window.doMarkCalled = async function doMarkCalled(id){
  try{ await markCalled(id); }
  catch(e){ alert('Gagal menandai dipanggil, coba lagi.'); }
}

/* ---------------- HELPER WAKTU (Firestore Timestamp) ---------------- */
function toMillis(time){
  if (!time) return 0;
  if (typeof time.toMillis === 'function') return time.toMillis();
  if (typeof time.seconds === 'number') return time.seconds * 1000;
  return new Date(time).getTime() || 0;
}
function getTimeAgo(time) {
  const millis = toMillis(time);
  if (!millis) return 'baru saja';
  const seconds = Math.floor((Date.now() - millis) / 1000);
  if (seconds < 60) return 'baru saja';
  const minutes = Math.floor(seconds / 60);
  return `${minutes} menit lalu`;
}
setInterval(renderQueue, 15000); // supaya "X menit lalu" ikut ter-update
</script>

</body>
</html>
