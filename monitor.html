<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papan Penjemputan — An Nashir Islamic School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-color: #0d1520;
    --card-bg: #064e3b;
    --card-border: #10b981;
    --card-border-waiting: #f59e0b;
    --text-main: #ffffff;
    --text-sub: #a7f3d0;
    --accent-yellow: #f59e0b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg-color);
    color: var(--text-main);
    font-family: 'Plus Jakarta Sans', sans-serif;
    min-height: 100vh;
    padding: 24px;
  }

  /* ---------- LOGIN GATE ---------- */
  .login-wrap{display:flex;justify-content:center;align-items:center;min-height:90vh;}
  .login-card{width:100%;max-width:360px;background:#0f2136;border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:32px 26px;text-align:center;}
  .lock-icon{width:52px;height:52px;border-radius:50%;background:rgba(245,158,11,.15);color:var(--accent-yellow);display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 14px;}
  .login-title{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;margin-bottom:4px;}
  .login-sub{font-size:13px;color:#94a3b8;margin-bottom:18px;}
  .login-input{width:100%;padding:11px 13px;margin-top:10px;border:1.5px solid rgba(255,255,255,.15);border-radius:10px;background:rgba(255,255,255,.05);color:#fff;font-size:14px;font-family:inherit;outline:none;}
  .login-input:focus{border-color:var(--card-border);}
  .login-btn{width:100%;margin-top:16px;padding:12px;border:none;border-radius:10px;background:#10b981;color:#fff;font-weight:700;font-size:14.5px;cursor:pointer;}
  .login-error{color:#f87171;font-size:12.5px;font-weight:600;min-height:16px;margin-top:10px;}

  /* Header & Jam */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .brand { display: flex; align-items: center; gap: 16px; }
  .logo { width: 50px; height: 50px; object-fit: contain; border-radius:50%; }
  .title { font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700; }
  .subtitle { font-size: 14px; color: #94a3b8; font-weight: 600; letter-spacing: 1px; }

  .clock-box { text-align: right; }
  .date-str { font-size: 14px; color: #94a3b8; font-weight: 600; }
  .time-str { font-family: 'Space Grotesk', sans-serif; font-size: 36px; font-weight: 700; color: var(--accent-yellow); line-height: 1; }

  /* FILTER BAR KELAS (Semua, P1 - P6) */
  .filter-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
    background: rgba(255, 255, 255, 0.05);
    padding: 8px 12px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    overflow-x: auto;
  }
  .filter-btn {
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #cbd5e1;
    padding: 8px 20px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .filter-btn:hover {
    background: rgba(255, 255, 255, 0.1);
    color: #ffffff;
  }
  .filter-btn.active {
    background: #10b981;
    color: #ffffff;
    border-color: #10b981;
    box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
  }

  /* Grid Kartu Monitor */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 20px;
  }

  .card {
    background: linear-gradient(135deg, #064e3b 0%, #022c22 100%);
    border: 2px solid var(--card-border);
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    animation: fadeIn 0.3s ease-out;
  }
  /* Kartu yang BELUM dipanggil keluar: warna amber, bukan hijau */
  .card.waiting {
    background: linear-gradient(135deg, #3a2a0f 0%, #201404 100%);
    border-color: var(--card-border-waiting);
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .badge-dipanggil {
    background: rgba(245, 158, 11, 0.2);
    color: var(--accent-yellow);
    border: 1px solid var(--accent-yellow);
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .badge-waiting {
    background: rgba(148, 163, 184, 0.15);
    color: #cbd5e1;
    border: 1px solid rgba(148, 163, 184, 0.4);
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .badge-kelas {
    background: rgba(0,0,0,0.4);
    color: #ffffff;
    padding: 4px 12px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
  }

  .student-name {
    font-size: 24px;
    font-weight: 800;
    color: #ffffff;
    margin-bottom: 8px;
    line-height: 1.2;
  }
  .picker-info {
    font-size: 15px;
    color: var(--text-sub);
    margin-bottom: 16px;
  }

  .btn-action {
    width: 100%;
    border: none;
    padding: 11px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 14px;
    text-align: center;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-call {
    background: rgba(245, 158, 11, 0.15);
    border: 1px solid rgba(245, 158, 11, 0.6);
    color: var(--accent-yellow);
  }
  .btn-call:hover { background: rgba(245, 158, 11, 0.28); }
  .btn-done {
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(16, 185, 129, 0.5);
    color: #a7f3d0;
  }
  .btn-done:hover { background: rgba(16, 185, 129, 0.2); }

  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px;
    color: #64748b;
    font-size: 18px;
    font-weight: 600;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<!-- LOGIN GATE: perangkat TV/monitor login sekali sebagai guru piket -->
<div class="login-wrap" id="login-wrap">
  <div class="login-card">
    <div class="lock-icon">🔒</div>
    <div class="login-title">Masuk Perangkat Layar Kelas</div>
    <div class="login-sub">Login sekali di perangkat ini, lalu biarkan tetap terbuka.</div>
    <input class="login-input" id="login-email" type="email" placeholder="Email guru/admin">
    <input class="login-input" id="login-pass" type="password" placeholder="Kata sandi" onkeydown="if(event.key==='Enter') doLogin()">
    <div class="login-error" id="login-error"></div>
    <button class="login-btn" onclick="doLogin()">Masuk</button>
  </div>
</div>

<!-- BOARD (baru tampil setelah login berhasil) -->
<div id="board-wrap" style="display:none;">
  <div class="header">
    <div class="brand">
      <img src="logo.png" alt="Logo" class="logo">
      <div>
        <div class="title">Papan Penjemputan</div>
        <div class="subtitle">AN NASHIR ISLAMIC SCHOOL (SD) · LIVE</div>
      </div>
    </div>
    <div class="clock-box">
      <div class="date-str" id="date-str">--</div>
      <div class="time-str" id="time-str">--:--</div>
    </div>
  </div>

  <!-- FILTER BAR KELAS -->
  <div class="filter-bar">
    <button class="filter-btn active" onclick="setFilter('ALL', this)">Semua Kelas</button>
    <button class="filter-btn" onclick="setFilter('P1', this)">Kelas P1</button>
    <button class="filter-btn" onclick="setFilter('P2', this)">Kelas P2</button>
    <button class="filter-btn" onclick="setFilter('P3', this)">Kelas P3</button>
    <button class="filter-btn" onclick="setFilter('P4', this)">Kelas P4</button>
    <button class="filter-btn" onclick="setFilter('P5', this)">Kelas P5</button>
    <button class="filter-btn" onclick="setFilter('P6', this)">Kelas P6</button>
  </div>

  <!-- CONTAINER KARTU -->
  <div class="grid" id="monitor-grid">
    <div class="empty-state">Memuat antrean penjemputan…</div>
  </div>
</div>

<script type="module">
import { watchAdminSession, adminLogin, listenQueue, markCalled, markPickupDone } from "./firebase-config.js";

let currentQueue = [];
let selectedClassFilter = 'ALL';
let unsubQueue = null;

/* ---------------- LOGIN ---------------- */
window.doLogin = async function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  if(!email || !pass){ errEl.textContent = 'Email dan kata sandi wajib diisi.'; return; }
  try{
    await adminLogin(email, pass);
  }catch(e){
    errEl.textContent = 'Email atau kata sandi salah.';
  }
}

watchAdminSession((user)=>{
  const loginWrap = document.getElementById('login-wrap');
  const boardWrap = document.getElementById('board-wrap');
  if(user){
    loginWrap.style.display = 'none';
    boardWrap.style.display = 'block';
    if(!unsubQueue){
      unsubQueue = listenQueue((data)=>{ currentQueue = data || []; renderQueue(); });
    }
  } else {
    loginWrap.style.display = 'flex';
    boardWrap.style.display = 'none';
    if(unsubQueue){ unsubQueue(); unsubQueue = null; }
  }
});

/* ---------------- JAM & TANGGAL ---------------- */
function updateClock() {
  const now = new Date();
  const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
  document.getElementById('date-str').textContent = now.toLocaleDateString('id-ID', dateOptions);
  const hours = String(now.getHours()).padStart(2, '0');
  const minutes = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('time-str').textContent = `${hours}.${minutes}`;
}
setInterval(updateClock, 1000);
updateClock();

/* ---------------- FILTER KELAS ---------------- */
window.setFilter = function(cls, btn) {
  selectedClassFilter = cls;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderQueue();
}

/* ---------------- RENDER PAPAN ---------------- */
function renderQueue() {
  const grid = document.getElementById('monitor-grid');

  let filtered = [...currentQueue];
  if (selectedClassFilter !== 'ALL') {
    filtered = filtered.filter(item => String(item.class).toUpperCase().includes(selectedClassFilter));
  }
  // Yang paling baru muncul di atas
  filtered.sort((a, b) => toMillis(b.time) - toMillis(a.time));

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-state">Tidak ada antrean panggilan ${selectedClassFilter === 'ALL' ? '' : 'untuk Kelas ' + selectedClassFilter}.</div>`;
    return;
  }

  grid.innerHTML = filtered.map(item => {
    const called = item.status === 'called';
    return `
    <div class="card ${called ? '' : 'waiting'}">
      <div>
        <div class="card-top">
          ${called
            ? `<div class="badge-dipanggil">🔔 DIPANGGIL</div>`
            : `<div class="badge-waiting">⏳ MENUNGGU</div>`}
          <div class="badge-kelas">Kelas ${item.class}</div>
        </div>
        <div class="student-name">${item.name}</div>
        <div class="picker-info">Penjemput: <b>${item.picker || 'Orang Tua'}</b> · ${getTimeAgo(item.time)}</div>
      </div>
      ${called
        ? `<button class="btn-action btn-done" onclick="doMarkDone('${item.id}')">✓ Selesai — anak sudah diserahkan</button>`
        : `<button class="btn-action btn-call" onclick="doMarkCalled('${item.id}')">📢 Panggil Keluar</button>`}
    </div>
  `;
  }).join('');
}

window.doMarkCalled = async function doMarkCalled(id){
  try{ await markCalled(id); }
  catch(e){ alert('Gagal menandai dipanggil, coba lagi.'); }
}
window.doMarkDone = async function doMarkDone(id){
  try{ await markPickupDone(id); }
  catch(e){ alert('Gagal menandai selesai, coba lagi.'); }
}

/* ---------------- HELPER WAKTU (Firestore Timestamp) ---------------- */
function toMillis(time){
  if (!time) return 0;
  if (typeof time.toMillis === 'function') return time.toMillis();
  if (typeof time.seconds === 'number') return time.seconds * 1000;
  return new Date(time).getTime() || 0;
}
function getTimeAgo(time) {
  const millis = toMillis(time);
  if (!millis) return 'baru saja';
  const seconds = Math.floor((Date.now() - millis) / 1000);
  if (seconds < 60) return 'baru saja';
  const minutes = Math.floor(seconds / 60);
  return `${minutes} menit lalu`;
}
setInterval(renderQueue, 15000); // supaya "X menit lalu" ikut ter-update
</script>

</body>
</html>
