<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0F1C2E">

<!-- Integration Web App Manifest (PWA) -->
<link rel="manifest" href="manifest.json">

<!-- Meta Tag iOS / Android Shortcut -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Penjemputan">

<title>Aplikasi Penjemputan — An Nashir Islamic School</title>
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<style>
  .multi-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    padding: 10px 14px;
    border-radius: 12px;
    margin-bottom: 12px;
  }
  .multi-bar-label {
    font-size: 13px;
    font-weight: 600;
    color: #334155;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }
  .multi-bar-label input[type="checkbox"], .checkbox-custom {
    width: 18px;
    height: 18px;
    accent-color: #0F1C2E;
    cursor: pointer;
  }
  
  .floating-action-bar {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 32px);
    max-width: 480px;
    background: #0F1C2E;
    color: #ffffff;
    padding: 12px 20px;
    border-radius: 30px;
    box-shadow: 0 10px 25px -5px rgba(15, 28, 46, 0.4);
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 99;
    animation: slideUp 0.3s ease-out;
  }
  .floating-action-text {
    font-size: 14px;
    font-weight: 600;
  }
  .floating-action-btn {
    background: #2563eb;
    color: #ffffff;
    border: none;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .floating-action-btn:active {
    transform: scale(0.96);
  }

  .step-indicator {
    background: #e2e8f0;
    color: #334155;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 6px;
    display: inline-block;
    margin-bottom: 6px;
  }

  .status-badge-mini {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
    display: inline-block;
    margin-left: 6px;
  }
  .status-badge-mini.waiting { background: #fef3c7; color: #b45309; }
  .status-badge-mini.done { background: #dcfce7; color: #15803d; }

  @keyframes slideUp {
    from { transform: translate(-50%, 100%); opacity: 0; }
    to { transform: translate(-50%, 0); opacity: 1; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">
    <div class="topbar-logo"><img src="logo.png" alt="Logo An Nashir Islamic School"></div>
    <div>
      <div class="topbar-name">Aplikasi Penjemputan</div>
      <div class="topbar-sub">An Nashir Islamic School (Primary)</div>
    </div>
  </div>
</div>

<div class="page-wrap">

  <!-- Status Lokasi GPS -->
  <div class="geo-pill" id="geo-pill">
    <div class="geo-dot" id="geo-dot"></div>
    <div>
      <div class="geo-label" id="geo-label">Mengecek lokasi…</div>
      <div class="geo-sub" id="geo-sub">Aktifkan izin lokasi di browser Anda</div>
    </div>
    <button class="geo-retry" id="geo-retry" style="display:none;" onclick="checkLocation()">Coba lagi</button>
  </div>

  <!-- Bagikan Tautan Penjemputan -->
  <button class="share-btn" onclick="sharePickupLink()">
    <span>📲 Bagikan Tautan Penjemputan</span>
  </button>

  <div id="body-content">
    <div class="empty-state">Memuat data…</div>
  </div>

</div>

<!-- Floating Action Bar untuk Multi-Select -->
<div id="floating-bar-container"></div>

<!-- PIN SHEET MODAL -->
<div class="sheet-overlay" id="sheet-overlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div id="sheet-content"></div>
  </div>
</div>

<script type="module">
import { listenRoster, listenQueue, submitPickup, changeFamilyPin } from "./firebase-config.js";

let ROSTER = [];
let QUEUE = [];
let coords = null;
let selectedStudents = []; 
let currentStudentIndex = 0; // Index antrean verifikasi PIN bertahap
let successfulPickups = [];  // Menyimpan data siswa yang PIN-nya berhasil divalidasi
let pin = '';
let pickerName = '';
let mode = 'jemput'; 
let isMultiSelectMode = false; 
let selectedClassFilter = 'ALL'; 
let cpStudent = null;
let cpStage = 'current';
let cpPin = '';
let cpVals = { current: '', new: '', confirm: '' };

// Share Link
window.sharePickupLink = async function sharePickupLink() {
  const shareData = {
    title: 'Aplikasi Penjemputan An Nashir',
    text: 'Tautan Penjemputan Siswa An Nashir Islamic School:',
    url: window.location.origin + window.location.pathname
  };

  if (navigator.share) {
    try { await navigator.share(shareData); } catch (err) {}
  } else {
    try {
      await navigator.clipboard.writeText(shareData.url);
      alert('Tautan penjemputan berhasil disalin!');
    } catch (err) {}
  }
};

const AVATAR_COLORS = ['#2563eb', '#7c3aed', '#db2777', '#ea580c', '#059669', '#0891b2', '#4f46e5', '#d97706'];
function getAvatarBgColor(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
}

/* ---------------- GEOLOCATION ---------------- */
window.checkLocation = function checkLocation(){
  const dot = document.getElementById('geo-dot');
  const label = document.getElementById('geo-label');
  const sub = document.getElementById('geo-sub');
  const retry = document.getElementById('geo-retry');
  retry.style.display='none';
  label.textContent = 'Mengecek lokasi…';
  sub.textContent = 'Mohon tunggu sebentar (menyempurnakan akurasi GPS)';
  dot.className='geo-dot';

  if(!navigator.geolocation){
    dot.className='geo-dot bad';
    label.textContent='Perangkat tidak mendukung lokasi';
    sub.textContent='Gunakan browser lain atau hubungi guru piket';
    return;
  }

  let best = null;
  let watchId = null;
  let finished = false;

  function finish(){
    if(finished) return;
    finished = true;
    if(watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    if(best){
      coords = best;
      dot.className='geo-dot ok';
      label.textContent='Lokasi terdeteksi';
      sub.textContent = `Akurasi ±${Math.round(best.accuracy)}m — jarak diverifikasi ulang saat memilih siswa`;
    } else {
      dot.className='geo-dot bad';
      label.textContent='Lokasi belum ditemukan';
      sub.textContent='Aktifkan izin lokasi lalu coba lagi';
      retry.style.display='inline-block';
    }
    renderBody();
  }

  watchId = navigator.geolocation.watchPosition(
    (pos)=>{
      if(!best || pos.coords.accuracy < best.accuracy) best = pos.coords;
      if(pos.coords.accuracy <= 30) finish();
    },
    (err)=>{ if(!best) finish(); },
    { enableHighAccuracy:true, timeout:10000, maximumAge:0 }
  );
  setTimeout(finish, 6000);
}
checkLocation();

/* ---------------- ROSTER + QUEUE ---------------- */
listenRoster((list)=>{ ROSTER = list; renderBody(); });
listenQueue((list)=>{ 
  QUEUE = list; 
  renderBody(); 
  // Update tampilan modal penjemputan secara realtime jika sedang terbuka
  if (successfulPickups.length > 0 && document.getElementById('sheet-overlay').classList.contains('open')) {
    updateWaitingScreenStatus();
  }
});

function renderBody(){
  const el = document.getElementById('body-content');
  const classes = ['ALL', 'P1', 'P2', 'P3', 'P4', 'P5', 'P6'];

  el.innerHTML = `
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="search-input" placeholder="Cari nama anak…" oninput="filterList()">
    </div>

    <!-- Toggle Mode Jemput Lebih Dari 1 Anak -->
    ${mode === 'jemput' ? `
      <div class="multi-bar">
        <label class="multi-bar-label">
          <input type="checkbox" id="multi-toggle" ${isMultiSelectMode ? 'checked' : ''} onchange="toggleMultiSelect(this.checked)">
          Jemput lebih dari 1 anak sekaligus
        </label>
      </div>
    ` : ''}

    <!-- Filter Bar Kelas P1 - P6 -->
    <div class="class-filter-wrap">
      ${classes.map(c => `
        <button class="filter-chip ${selectedClassFilter === c ? 'active' : ''}" onclick="setClassFilter('${c}')">
          ${c === 'ALL' ? 'Semua Kelas' : 'Kelas ' + c}
        </button>
      `).join('')}
    </div>

    ${mode === 'gantipin' ? `
      <div class="mode-banner">
        <span>🔑 Mode Ganti PIN aktif — pilih nama anak untuk mengganti PIN keluarganya</span>
        <button class="mode-banner-cancel" onclick="toggleChangePinMode()">Batal</button>
      </div>
    ` : ''}
    <div class="section-label-row">
      <div class="section-label">${mode === 'gantipin' ? 'Pilih siswa untuk ganti PIN' : 'Pilih siswa yang dijemput'}</div>
      ${mode === 'jemput' ? `<button class="link-btn" onclick="toggleChangePinMode()">🔑 Lupa / ganti PIN</button>` : ''}
    </div>
    <div class="student-list" id="student-list"></div>
  `;
  filterList();
}

window.toggleMultiSelect = function toggleMultiSelect(checked) {
  isMultiSelectMode = checked;
  selectedStudents = [];
  renderFloatingBar();
  filterList();
};

window.setClassFilter = function setClassFilter(cls) {
  selectedClassFilter = cls;
  renderBody();
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

window.toggleChangePinMode = function toggleChangePinMode(){
  mode = mode === 'jemput' ? 'gantipin' : 'jemput';
  isMultiSelectMode = false;
  selectedStudents = [];
  renderFloatingBar();
  renderBody();
};

window.filterList = function filterList(){
  const searchInput = document.getElementById('search-input');
  const q = searchInput ? searchInput.value.toLowerCase().trim().replace(/\s+/g, ' ') : '';
  
  let filtered = [...ROSTER];
  if (selectedClassFilter !== 'ALL') {
    filtered = filtered.filter(s => String(s.class).toUpperCase().includes(selectedClassFilter));
  }
  if (q) {
    filtered = filtered.filter(s => s.name.toLowerCase().includes(q));
  }
  filtered.sort((a, b) => a.name.localeCompare(b.name, 'id', { sensitivity: 'base' }));

  renderStudentList(filtered);
};

function renderStudentList(list){
  const el = document.getElementById('student-list');
  if(!el) return;

  if(ROSTER.length === 0){
    el.innerHTML = [1, 2, 3, 4].map(() => `
      <div class="skeleton-row">
        <div class="skeleton-avatar"></div>
        <div class="skeleton-text-group">
          <div class="skeleton-line long"></div>
          <div class="skeleton-line short"></div>
        </div>
      </div>
    `).join('');
    return;
  }

  if(list.length === 0){
    el.innerHTML = `<div class="empty-state">Tidak ditemukan.</div>`;
    return;
  }

  el.innerHTML = list.map(s=>{
    const called = mode === 'jemput' && QUEUE.find(q=>q.studentId===s.id);
    const initials = s.name.split(' ').slice(0,2).map(w=>w[0]).join('');
    const avatarBg = getAvatarBgColor(s.name);
    const isChecked = selectedStudents.some(item => item.id === s.id);
    
    let onClickAttr = '';
    if (!called) {
      if (mode === 'gantipin') {
        onClickAttr = `onclick="openChangePin('${s.id}')"`;
      } else if (isMultiSelectMode) {
        onClickAttr = `onclick="toggleSelectStudent('${s.id}')"`;
      } else {
        onClickAttr = `onclick="openPinSingle('${s.id}')"`;
      }
    }

    return `
    <div class="student-row ${called?'disabled':''}" ${onClickAttr}>
      <div class="student-left">
        ${isMultiSelectMode && mode === 'jemput' && !called ? `
          <input type="checkbox" class="checkbox-custom" ${isChecked ? 'checked' : ''} onclick="event.stopPropagation(); toggleSelectStudent('${s.id}')">
        ` : ''}
        <div class="avatar" style="background-color: ${avatarBg};">${initials}</div>
        <div>
          <div class="student-name">${s.name}</div>
          <div class="student-class">Kelas ${s.class}</div>
        </div>
      </div>
      ${called ? `<span class="status-tag">Sudah dipanggil</span>` : (
        isMultiSelectMode && mode === 'jemput' ? '' : `<span class="chevron">${mode==='gantipin' ? '🔑' : '›'}</span>`
      )}
    </div>`;
  }).join('');
}

// Toggle Seleksi Siswa Multi-Select
window.toggleSelectStudent = function toggleSelectStudent(id) {
  const student = ROSTER.find(s => s.id === id);
  if (!student) return;

  const idx = selectedStudents.findIndex(s => s.id === id);
  if (idx > -1) {
    selectedStudents.splice(idx, 1);
  } else {
    selectedStudents.push(student);
  }
  renderFloatingBar();
  filterList();
};

function renderFloatingBar() {
  const container = document.getElementById('floating-bar-container');
  if (!isMultiSelectMode || selectedStudents.length === 0) {
    container.innerHTML = '';
    return;
  }

  container.innerHTML = `
    <div class="floating-action-bar">
      <div class="floating-action-text">${selectedStudents.length} Siswa Terpilih</div>
      <button class="floating-action-btn" onclick="openPinMulti()">Lanjut Jemput ›</button>
    </div>
  `;
}

/* ---------------- VERIFIKASI PIN SEQUENTIAL ---------------- */
window.openPinSingle = function openPinSingle(id){
  const student = ROSTER.find(s => s.id === id);
  if(student) {
    selectedStudents = [student];
    startPickupFlow();
  }
};

window.openPinMulti = function openPinMulti(){
  if(selectedStudents.length === 0) return;
  startPickupFlow();
};

function startPickupFlow(){
  currentStudentIndex = 0;
  successfulPickups = [];
  pin = ''; 
  pickerName = '';
  renderPinSheet();
  document.getElementById('sheet-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('picker-name')?.focus(), 50);
}

window.closeSheet = function closeSheet(){
  document.getElementById('sheet-overlay').classList.remove('open');
}

window.updatePickerName = function updatePickerName(v){ pickerName = v; };

function renderPinSheet(pinErr, nameErr){
  const c = document.getElementById('sheet-content');
  const safeName = pickerName.replace(/"/g,'&quot;');
  
  const currentStudent = selectedStudents[currentStudentIndex];
  const isMulti = selectedStudents.length > 1;

  c.innerHTML = `
    <div class="sheet-title">Verifikasi Penjemputan</div>
    
    ${isMulti ? `<div class="step-indicator">Siswa ${currentStudentIndex + 1} dari ${selectedStudents.length}</div>` : ''}
    
    <div class="sheet-sub">
      Masukkan PIN untuk: <br><strong style="font-size:16px; color:#0F1C2E;">${currentStudent.name}</strong> (Kelas ${currentStudent.class})
    </div>

    <!-- Nama penjemput diisi 1x di awal -->
    <div class="field-label" style="margin-top:8px;">Nama penjemput <span style="color:var(--coral);">*wajib diisi</span></div>
    <input class="text-input" id="picker-name" value="${safeName}" ${currentStudentIndex > 0 ? 'readonly style="background:#f1f5f9;"' : ''} oninput="updatePickerName(this.value)" placeholder="cth: Budi (Ojek Online) / Nenek">
    <div class="pin-error">${nameErr||''}</div>

    <div class="field-label" style="margin-top:10px; text-align:center;">PIN (${currentStudent.name})</div>
    <div class="pin-dots" id="pin-dots">
      ${[0,1,2,3].map(i=>`<div class="pin-dot ${i<pin.length?'filled':''}"></div>`).join('')}
    </div>
    <div class="pin-error">${pinErr||''}</div>
    <div class="keypad">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" onclick="pressKey('${n}')">${n}</button>`).join('')}
      <button class="key func" onclick="closeSheet()">Batal</button>
      <button class="key" onclick="pressKey('0')">0</button>
      <button class="key func" onclick="backspace()">⌫</button>
    </div>
  `;
}

window.pressKey = function pressKey(n){
  if(!pickerName.trim()){
    renderPinSheet('', 'Isi nama penjemput dulu sebelum memasukkan PIN.');
    document.getElementById('picker-name')?.focus();
    return;
  }
  if(pin.length>=4) return;
  pin += n;
  renderPinSheet();
  if(pin.length===4) checkPin();
};

window.backspace = function backspace(){
  pin = pin.slice(0,-1);
  renderPinSheet();
};

async function checkPin(){
  if(!pickerName.trim()){
    pin='';
    renderPinSheet('', 'Isi nama penjemput dulu sebelum memasukkan PIN.');
    document.getElementById('picker-name')?.focus();
    return;
  }
  
  const dotsEl = document.getElementById('pin-dots');
  const c = document.getElementById('sheet-content');
  c.style.opacity='.5'; c.style.pointerEvents='none';

  const currentStudent = selectedStudents[currentStudentIndex];
  let res;

  try {
    res = await submitPickup(currentStudent.id, pin, pickerName.trim(), coords);
  } catch(e) {
    c.style.opacity='1'; c.style.pointerEvents='auto';
    pin='';
    renderPinSheet('Gagal menghubungi server.');
    return;
  }

  c.style.opacity='1'; c.style.pointerEvents='auto';

  if(res.ok) {
    successfulPickups.push({ student: currentStudent, queueId: res.queueId });
    
    currentStudentIndex++;
    
    if(currentStudentIndex < selectedStudents.length) {
      // Masih ada siswa lain, minta PIN siswa berikutnya secara sequential
      pin = '';
      renderPinSheet();
    } else {
      // Semua siswa berhasil diproses
      selectedStudents = [];
      renderFloatingBar();
      showWaitingScreen();
    }
    return;
  }

  // Penanganan kegagalan PIN
  pin='';
  if(dotsEl) dotsEl.classList.add('shake');

  const messages = {
    wrong_pin: `PIN salah untuk ${currentStudent.name}. ${res.attemptsLeft!=null ? `Sisa percobaan: ${res.attemptsLeft}.` : ''}`,
    locked: null,
    out_of_range: null,
    already_queued: `${currentStudent.name} sudah ada di antrean penjemputan.`,
  };

  if(res.reason === 'locked'){
    c.innerHTML = `
      <div class="sheet-title">Verifikasi terkunci</div>
      <div class="sheet-sub">Terlalu banyak percobaan PIN salah untuk ${currentStudent.name}.</div>
      <div class="lockout-box">🔒 Akses terkunci sementara. Hubungi guru piket di gerbang.</div>
      <button class="sheet-btn ghost" onclick="closeSheet()">Tutup</button>
    `;
  } else if(res.reason === 'out_of_range'){
    c.innerHTML = `
      <div class="sheet-title">Diluar radius sekolah</div>
      <div class="sheet-sub">Lokasi Anda saat ini terlalu jauh dari gerbang sekolah.</div>
      <div class="warn-box">📍 Mendekatlah ke area sekolah, lalu coba lagi.</div>
      <button class="sheet-btn ghost" onclick="closeSheet()">Tutup</button>
    `;
  } else {
    renderPinSheet(messages[res.reason] || 'Gagal memproses penjemputan.');
  }
}

function showWaitingScreen(){
  const c = document.getElementById('sheet-content');
  c.innerHTML = `
    <div class="success-wrap">
      <div class="success-icon waiting-icon" id="modal-status-icon">⏳</div>
      <div class="success-title" id="modal-status-title">Berhasil Masuk Antrean</div>
      <div class="success-sub">Permintaan penjemputan berhasil dikirim untuk:</div>
      <div id="modal-student-list" style="margin:12px 0; text-align:left; background:#f8fafc; padding:12px; border-radius:10px; font-size:14px; line-height:1.8; color:#1e293b;">
      </div>
      <div class="success-sub" id="modal-status-sub">Silakan menunggu anak-anak dipanggil oleh guru piket di gerbang.</div>
      
      <!-- Tombol ini disembunyikan sampai monitor memanggil SEMUA anak -->
      <button class="sheet-btn" id="done-close-btn" style="margin-top:14px; display:none;" onclick="closeSheet()">Selesai & Tutup</button>
    </div>
  `;
  updateWaitingScreenStatus();
}

function updateWaitingScreenStatus(){
  const listEl = document.getElementById('modal-student-list');
  const doneBtn = document.getElementById('done-close-btn');
  const iconEl = document.getElementById('modal-status-icon');
  const titleEl = document.getElementById('modal-status-title');
  const subEl = document.getElementById('modal-status-sub');
  
  if (!listEl) return;

  let allCalled = true;

  const namesHtml = successfulPickups.map(p => {
    // Cek apakah siswa masih berada di QUEUE (antrean aktif)
    const inQueue = QUEUE.find(q => q.studentId === p.student.id || q.id === p.queueId);
    
    // Jika tidak ada di QUEUE, atau status di QUEUE bernilai 'called'/'done', berarti sudah dipanggil
    const isCalled = !inQueue || (inQueue && (inQueue.status === 'called' || inQueue.status === 'done'));

    if (!isCalled) {
      allCalled = false; // Masih ada minimal 1 anak yang belum dipanggil
    }

    return `
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;">
        <span>• <b>${p.student.name}</b> (Kelas ${p.student.class})</span>
        ${isCalled 
          ? `<span class="status-badge-mini done">✓ Dipanggil</span>` 
          : `<span class="status-badge-mini waiting">⏳ Antrean</span>`}
      </div>
    `;
  }).join('');

  listEl.innerHTML = namesHtml;

  // Kontrol tampilan tombol & status berdasarkan sinyal dari monitor
  if (allCalled) {
    if (doneBtn) doneBtn.style.display = 'block'; // Tampilkan tombol
    if (iconEl) iconEl.textContent = '✓';
    if (titleEl) titleEl.textContent = 'Siswa Siap DiJemput';
    if (subEl) subEl.textContent = 'Anak-anak sudah dipanggil oleh guru piket. Silakan ambil siswa di gerbang.';
  } else {
    if (doneBtn) doneBtn.style.display = 'none'; // Sembunyikan tombol
    if (iconEl) iconEl.textContent = '⏳';
    if (titleEl) titleEl.textContent = 'Berhasil Masuk Antrean';
    if (subEl) subEl.textContent = 'Silakan menunggu anak-anak dipanggil oleh guru piket di gerbang.';
  }
}

/* ---------------- FITUR GANTI PIN ---------------- */
window.openChangePin = function openChangePin(id){
  cpStudent = ROSTER.find(s=>s.id===id);
  cpStage = 'current'; cpPin = ''; cpVals = { current:'', new:'', confirm:'' };
  renderChangePinSheet();
  document.getElementById('sheet-overlay').classList.add('open');
};

const CP_LABELS = {
  current: { title: 'Verifikasi PIN Lama', sub: (n)=>`Masukkan PIN keluarga yang berlaku saat ini untuk ${n}` },
  new:      { title: 'Buat PIN Baru',       sub: ()=>'Masukkan PIN baru (4 digit)' },
  confirm: { title: 'Konfirmasi PIN Baru', sub: ()=>'Ulangi sekali lagi PIN baru untuk konfirmasi' },
};

function renderChangePinSheet(err){
  const c = document.getElementById('sheet-content');
  const { title, sub } = CP_LABELS[cpStage];
  c.innerHTML = `
    <div class="sheet-title">${title}</div>
    <div class="sheet-sub">${sub(cpStudent.name)} · Kelas ${cpStudent.class}</div>
    <div class="pin-dots" id="pin-dots">
      ${[0,1,2,3].map(i=>`<div class="pin-dot ${i<cpPin.length?'filled':''}"></div>`).join('')}
    </div>
    <div class="pin-error">${err||''}</div>
    <div class="keypad">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" onclick="cpPressKey('${n}')">${n}</button>`).join('')}
      <button class="key func" onclick="closeSheet()">Batal</button>
      <button class="key" onclick="cpPressKey('0')">0</button>
      <button class="key func" onclick="cpBackspace()">⌫</button>
    </div>
  `;
}

window.cpPressKey = function cpPressKey(n){
  if(cpPin.length>=4) return;
  cpPin += n;
  renderChangePinSheet();
  if(cpPin.length===4) cpAdvance();
};

window.cpBackspace = function cpBackspace(){
  cpPin = cpPin.slice(0,-1);
  renderChangePinSheet();
};

async function cpAdvance(){
  if(cpStage === 'current'){
    cpVals.current = cpPin; cpPin = ''; cpStage = 'new';
    renderChangePinSheet();
    return;
  }
  if(cpStage === 'new'){
    cpVals.new = cpPin; cpPin = ''; cpStage = 'confirm';
    renderChangePinSheet();
    return;
  }
  cpVals.confirm = cpPin;
  if(cpVals.new !== cpVals.confirm){
    cpPin = ''; cpStage = 'new';
    renderChangePinSheet('PIN baru tidak cocok dengan konfirmasi. Coba lagi dari PIN baru.');
    return;
  }

  const dotsEl = document.getElementById('pin-dots');
  const c = document.getElementById('sheet-content');
  c.style.opacity='.5'; c.style.pointerEvents='none';
  let result;
  try{
    result = await changeFamilyPin(cpStudent.id, cpVals.current, cpVals.new, coords);
  }catch(e){
    c.style.opacity='1'; c.style.pointerEvents='auto';
    cpPin=''; cpStage='current'; cpVals={current:'',new:'',confirm:''};
    renderChangePinSheet('Gagal menghubungi server. Periksa koneksi internet Anda.');
    return;
  }
  c.style.opacity='1'; c.style.pointerEvents='auto';

  if(result.ok){
    c.innerHTML = `
      <div class="success-wrap">
        <div class="success-icon">✓</div>
        <div class="success-title">PIN Berhasil Diganti</div>
        <div class="success-sub">PIN keluarga untuk ${cpStudent.name} sudah diperbarui. PIN lama tidak berlaku lagi mulai sekarang.</div>
        <button class="sheet-btn" onclick="closeSheet(); mode='jemput'; renderBody();">Selesai</button>
      </div>
    `;
    return;
  }

  cpPin=''; cpVals={current:'',new:'',confirm:''};
  if(dotsEl) dotsEl.classList.add('shake');

  if(result.reason === 'locked'){
    c.innerHTML = `
      <div class="sheet-title">Verifikasi terkunci</div>
      <div class="sheet-sub">Terlalu banyak percobaan PIN salah untuk ${cpStudent.name}.</div>
      <div class="lockout-box">🔒 Demi keamanan, akun ini dikunci sementara. Silakan hubungi <b>guru piket di gerbang</b> untuk verifikasi manual.</div>
      <button class="sheet-btn ghost" onclick="closeSheet()">Tutup</button>
    `;
  } else if(result.reason === 'out_of_range'){
    c.innerHTML = `
      <div class="sheet-title">Diluar radius sekolah</div>
      <div class="sheet-sub">Anda harus berada di area sekolah untuk mengganti PIN.</div>
      <div class="warn-box">📍 Mendekatlah ke area sekolah, lalu coba lagi.</div>
      <button class="sheet-btn ghost" onclick="closeSheet()">Tutup</button>
    `;
  } else {
    cpStage = 'current';
    renderChangePinSheet(`PIN lama salah. ${result.attemptsLeft!=null ? `Percobaan tersisa: ${result.attemptsLeft}.` : ''}`);
  }
}
</script>
</body>
</html>
