<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0F1C2E">
<title>Jemput — An Nashir Islamic School</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">
    <div class="topbar-logo"><img src="logo.png" alt="Logo An Nashir Islamic School"></div>
    <div>
      <div class="topbar-name">Jemput</div>
      <div class="topbar-sub">An Nashir Islamic School (SD)</div>
    </div>
  </div>
</div>

<div class="page-wrap">

  <!-- BAR GPS / LOKASI TERDETEKSI -->
  <div class="geo-pill" id="geo-pill">
    <div class="geo-dot" id="geo-dot"></div>
    <div>
      <div class="geo-label" id="geo-label">Mengecek lokasi…</div>
      <div class="geo-sub" id="geo-sub">Aktifkan izin lokasi di browser Anda</div>
    </div>
    <button class="geo-retry" id="geo-retry" style="display:none;" onclick="checkLocation()">Coba lagi</button>
  </div>

  <!-- TOMBOL BAGIKAN LINK -->
  <button class="share-btn" onclick="shareLink()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
      <polyline points="16 6 12 2 8 6"></polyline>
      <line x1="12" y1="2" x2="12" y2="15"></line>
    </svg>
    <span>Bagikan Link Penjemputan</span>
  </button>

  <div id="body-content">
    <div class="empty-state">Memuat…</div>
  </div>

</div>

<!-- BOTTOM BAR MELAYANG JIKA ANAK DICENTANG -->
<div class="pickup-bar" id="pickup-bar" style="display: none;">
  <div class="pickup-bar-info">
    <span class="pickup-bar-count" id="pickup-bar-count">0 Siswa Dipilih</span>
    <span class="pickup-bar-sub">Ketuk tombol untuk memproses penjemputan</span>
  </div>
  <button class="pickup-bar-btn" onclick="startMultiPickupProcess()">Lanjut Penjemputan ›</button>
</div>

<!-- PIN SHEET MODAL -->
<div class="sheet-overlay" id="sheet-overlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div id="sheet-content"></div>
  </div>
</div>

<script type="module">
import { listenRoster, listenQueue, submitPickup, changeFamilyPin, listenQueueEntry } from "./firebase-config.js";

let ROSTER = [];
let QUEUE = [];
let coords = null;

/* State Penjemputan Multi-Anak */
let selectedStudentIds = []; // Daftar ID siswa yang dicentang
let currentMultiIndex = 0;   // Urutan anak yang sedang diisi PIN-nya
let verifiedPickups = [];    // Menyimpan data anak yang PIN-nya berhasil diproses

let pin = '';
let pickerName = '';
let mode = 'jemput'; // 'jemput' | 'gantipin'
let cpStudent = null;
let cpStage = 'current'; // 'current' | 'new' | 'confirm'
let cpPin = '';
let cpVals = { current: '', new: '', confirm: '' };
let unsubWaiting = null;
let selectedClassFilter = 'Semua';

/* ---------------- FUNGSI BAGIKAN LINK ---------------- */
window.shareLink = function shareLink() {
  const shareData = {
    title: 'Jemput — An Nashir Islamic School',
    text: 'Akses link penjemputan siswa An Nashir Islamic School:',
    url: window.location.href
  };

  if (navigator.share) {
    navigator.share(shareData).catch(() => {});
  } else {
    navigator.clipboard.writeText(window.location.href);
    alert('Link penjemputan berhasil disalin!');
  }
};

/* ---------------- SUARA NOTIFIKASI ---------------- */
let notifAudioCtx = null;
function warmUpAudio(){
  if(!notifAudioCtx){
    try{ notifAudioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ notifAudioCtx = null; }
  }
}
function playTone(ctx, freq, startTime, duration){
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.0001, startTime);
  gain.gain.exponentialRampToValueAtTime(0.35, startTime + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
  osc.connect(gain).connect(ctx.destination);
  osc.start(startTime);
  osc.stop(startTime + duration + 0.05);
}
function playCallNotifSound(){
  if(!notifAudioCtx) return;
  if(notifAudioCtx.state === 'suspended') notifAudioCtx.resume();
  const now = notifAudioCtx.currentTime;
  playTone(notifAudioCtx, 880, now, 0.18);
  playTone(notifAudioCtx, 1175, now + 0.2, 0.24);
}

/* ---------------- GEOLOCATION ---------------- */
window.checkLocation = function checkLocation(){
  const dot = document.getElementById('geo-dot');
  const label = document.getElementById('geo-label');
  const sub = document.getElementById('geo-sub');
  const retry = document.getElementById('geo-retry');
  retry.style.display='none';
  label.textContent = 'Mengecek lokasi…';
  sub.textContent = 'Mohon tunggu sebentar (menyempurnakan akurasi GPS)';
  dot.className='geo-dot';

  if(!navigator.geolocation){
    dot.className='geo-dot bad';
    label.textContent='Perangkat tidak mendukung lokasi';
    sub.textContent='Gunakan browser lain atau hubungi guru piket';
    return;
  }

  let best = null;
  let watchId = null;
  let finished = false;

  function finish(){
    if(finished) return;
    finished = true;
    if(watchId !== null) navigator.geolocation.clearWatch(watchId);
    if(best){
      coords = best;
      dot.className='geo-dot ok';
      label.textContent='Lokasi terdeteksi';
      sub.textContent = `Akurasi ±${Math.round(best.accuracy)}m — jarak diverifikasi saat penjemputan`;
    } else {
      dot.className='geo-dot bad';
      label.textContent='Lokasi belum ditemukan';
      sub.textContent='Aktifkan izin lokasi lalu coba lagi';
      retry.style.display='inline-block';
    }
    renderBody();
  }

  watchId = navigator.geolocation.watchPosition(
    (pos)=>{
      if(!best || pos.coords.accuracy < best.accuracy){
        best = pos.coords;
      }
      if(pos.coords.accuracy <= 30){
        finish();
      }
    },
    (err)=>{
      if(!best) finish();
    },
    { enableHighAccuracy:true, timeout:10000, maximumAge:0 }
  );

  setTimeout(finish, 6000);
}
checkLocation();

/* ---------------- ROSTER + QUEUE (real-time) ---------------- */
listenRoster((list)=>{ ROSTER = list; renderBody(); });
listenQueue((list)=>{ QUEUE = list; renderBody(); });

function renderBody(){
  const el = document.getElementById('body-content');
  const classes = ['Semua', 'P1', 'P2', 'P3', 'P4', 'P5', 'P6'];

  el.innerHTML = `
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="search-input" placeholder="Cari nama anak…" oninput="filterList()">
    </div>
    
    <!-- FILTER KELAS -->
    <div class="class-filter-wrap">
      ${classes.map(c => `
        <button class="class-filter-btn ${selectedClassFilter === c ? 'active' : ''}" onclick="selectClassFilter('${c}')">
          ${c}
        </button>
      `).join('')}
    </div>

    ${mode === 'gantipin' ? `
      <div class="mode-banner">
        <span>🔑 Mode Ganti PIN aktif — pilih nama anak untuk mengganti PIN keluarganya</span>
        <button class="mode-banner-cancel" onclick="toggleChangePinMode()">Batal</button>
      </div>
    ` : ''}
    <div class="section-label-row">
      <div class="section-label">${mode === 'gantipin' ? 'Pilih siswa untuk ganti PIN' : 'Centang nama siswa yang ingin dijemput:'}</div>
      ${mode === 'jemput' ? `<button class="link-btn" onclick="toggleChangePinMode()">🔑 Lupa / ganti PIN</button>` : ''}
    </div>
    <div class="student-list" id="student-list"></div>
  `;
  filterList();
  updatePickupBar();
}

window.selectClassFilter = function selectClassFilter(c){
  selectedClassFilter = c;
  renderBody();
}

window.toggleChangePinMode = function toggleChangePinMode(){
  mode = mode === 'jemput' ? 'gantipin' : 'jemput';
  selectedStudentIds = [];
  renderBody();
}

function filterList(){
  const searchInput = document.getElementById('search-input');
  const q = searchInput ? searchInput.value.toLowerCase() : '';
  
  const filtered = ROSTER.filter(s => {
    const matchName = s.name.toLowerCase().includes(q);
    const matchClass = selectedClassFilter === 'Semua' || String(s.class).trim().toUpperCase() === selectedClassFilter.toUpperCase();
    return matchName && matchClass;
  });

  renderStudentList(filtered);
}

function renderStudentList(list){
  const el = document.getElementById('student-list');
  if(!el) return;
  if(list.length===0){
    el.innerHTML = `<div class="empty-state">${ROSTER.length===0 ? 'Memuat daftar siswa…' : 'Tidak ada siswa di kelas ini.'}</div>`;
    return;
  }
  el.innerHTML = list.map(s=>{
    const called = QUEUE.find(q=>q.studentId===s.id);
    const isSelected = selectedStudentIds.includes(s.id);
    const initials = s.name.split(' ').slice(0,2).map(w=>w[0]).join('');
    
    let onClickHandler = '';
    if(!called){
      if(mode === 'jemput'){
        onClickHandler = `onclick="toggleSelectStudent('${s.id}')"`;
      } else {
        onClickHandler = `onclick="openChangePin('${s.id}')"`;
      }
    }

    return `
    <div class="student-row ${called ? 'disabled' : ''} ${isSelected ? 'selected' : ''}" ${onClickHandler}>
      <div class="student-left">
        ${mode === 'jemput' && !called ? `
          <div class="checkbox ${isSelected ? 'checked' : ''}">
            ${isSelected ? '✓' : ''}
          </div>
        ` : `<div class="avatar">${initials}</div>`}
        <div>
          <div class="student-name">${s.name}</div>
          <div class="student-class">Kelas ${s.class}</div>
        </div>
      </div>
      ${called ? `<span class="status-tag">Sudah dipanggil</span>` : `<span class="chevron">${mode==='gantipin' ? '🔑' : '›'}</span>`}
    </div>`;
  }).join('');
}

/* ---------------- TOGGLE CHECKBOX SISWA & BAR MELAYANG ---------------- */
window.toggleSelectStudent = function toggleSelectStudent(id){
  const idx = selectedStudentIds.indexOf(id);
  if(idx > -1){
    selectedStudentIds.splice(idx, 1);
  } else {
    selectedStudentIds.push(id);
  }
  filterList();
  updatePickupBar();
}

function updatePickupBar(){
  const bar = document.getElementById('pickup-bar');
  const countEl = document.getElementById('pickup-bar-count');
  if(!bar) return;

  if(mode === 'jemput' && selectedStudentIds.length > 0){
    bar.style.display = 'flex';
    countEl.textContent = `${selectedStudentIds.length} Anak Terpilih`;
  } else {
    bar.style.display = 'none';
  }
}

/* ---------------- PROSES PENJEMPUTAN DENGAN MULTI PIN ---------------- */
window.startMultiPickupProcess = function startMultiPickupProcess(){
  if(selectedStudentIds.length === 0) return;
  if(unsubWaiting){ unsubWaiting(); unsubWaiting = null; }

  currentMultiIndex = 0;
  verifiedPickups = [];
  pin = '';
  pickerName = '';
  
  renderPinSheet();
  document.getElementById('sheet-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('picker-name')?.focus(), 50);
}

window.closeSheet = function closeSheet(){
  document.getElementById('sheet-overlay').classList.remove('open');
  if(unsubWaiting){ unsubWaiting(); unsubWaiting = null; }
}

window.updatePickerName = function updatePickerName(v){
  pickerName = v;
}

function renderPinSheet(pinErr, nameErr){
  const c = document.getElementById('sheet-content');
  const safeName = pickerName.replace(/"/g,'&quot;');
  const currentStudentId = selectedStudentIds[currentMultiIndex];
  const student = ROSTER.find(s => s.id === currentStudentId);
  const totalStudents = selectedStudentIds.length;

  c.innerHTML = `
    <div class="sheet-title">Verifikasi PIN Penjemputan</div>
    <div class="multi-step-badge">Anak ke-${currentMultiIndex + 1} dari ${totalStudents}</div>
    <div class="sheet-sub">Menjemput: <b>${student.name}</b> (Kelas ${student.class})</div>

    ${currentMultiIndex === 0 ? `
      <div class="field-label" style="margin-top:8px;">Nama Penjemput <span style="color:var(--coral);">*wajib diisi</span></div>
      <input class="text-input" id="picker-name" value="${safeName}" oninput="updatePickerName(this.value)" placeholder="cth: Ayah / Ibu / Pak Budi (Ojek)">
      <div class="pin-error">${nameErr||''}</div>
    ` : `
      <div class="picker-info-box">
        Penjemput: <b>${pickerName}</b>
      </div>
    `}

    <div class="field-label" style="margin-top:12px; text-align:center;">
      Masukkan PIN milik <b>${student.name}</b>
    </div>
    <div class="pin-dots" id="pin-dots">
      ${[0,1,2,3].map(i=>`<div class="pin-dot ${i<pin.length?'filled':''}"></div>`).join('')}
    </div>
    <div class="pin-error">${pinErr||''}</div>

    <div class="keypad">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" onclick="pressKey('${n}')">${n}</button>`).join('')}
      <button class="key func" onclick="closeSheet()">Batal</button>
      <button class="key" onclick="pressKey('0')">0</button>
      <button class="key func" onclick="backspace()">⌫</button>
    </div>
  `;
}

window.pressKey = function pressKey(n){
  warmUpAudio();
  if(!pickerName.trim()){
    renderPinSheet('', 'Isi nama penjemput terlebih dahulu.');
    document.getElementById('picker-name')?.focus();
    return;
  }
  if(pin.length>=4) return;
  pin += n;
  renderPinSheet();
  if(pin.length===4) checkAndAdvanceMultiPickup();
}

window.backspace = function backspace(){
  pin = pin.slice(0,-1);
  renderPinSheet();
}

async function checkAndAdvanceMultiPickup(){
  const currentStudentId = selectedStudentIds[currentMultiIndex];
  const dotsEl = document.getElementById('pin-dots');
  const c = document.getElementById('sheet-content');
  
  c.style.opacity='.5'; c.style.pointerEvents='none';

  let result;
  try {
    result = await submitPickup(currentStudentId, pin, pickerName.trim(), coords);
  } catch(e) {
    c.style.opacity='1'; c.style.pointerEvents='auto';
    pin='';
    renderPinSheet('Gagal menghubungi server. Periksa koneksi internet Anda.');
    return;
  }

  c.style.opacity='1'; c.style.pointerEvents='auto';

  if(result.ok){
    verifiedPickups.push({
      queueId: result.queueId,
      studentId: currentStudentId
    });

    currentMultiIndex++;
    pin = '';

    // Jika masih ada anak selanjutnya yang perlu PIN
    if(currentMultiIndex < selectedStudentIds.length){
      renderPinSheet();
    } else {
      // Semua PIN anak sudah selesai diverifikasi
      selectedStudentIds = [];
      updatePickupBar();
      showWaitingScreen(result.queueId);
    }
    return;
  }

  // Jika PIN salah
  pin='';
  if(dotsEl) dotsEl.classList.add('shake');

  const messages = {
    wrong_pin: `PIN salah. ${result.attemptsLeft!=null ? `Sisa percobaan: ${result.attemptsLeft}.` : ''}`,
    locked: null,
    out_of_range: null,
    already_queued: 'Siswa ini sudah masuk dalam antrean.',
  };

  const student = ROSTER.find(s=>s.id===currentStudentId);

  if(result.reason==='locked'){
    c.innerHTML = `
      <div class="sheet-title">Verifikasi terkunci</div>
      <div class="sheet-sub">Terlalu banyak percobaan PIN salah untuk ${student.name}.</div>
      <div class="lockout-box">🔒 Akses terkunci sementara. Silakan hubungi <b>guru piket</b> untuk verifikasi.</div>
      <button class="sheet-btn ghost" onclick="closeSheet()">Tutup</button>
    `;
  } else if(result.reason==='out_of_range'){
    c.innerHTML = `
      <div class="sheet-title">Di luar radius sekolah</div>
      <div class="sheet-sub">Lokasi Anda saat ini terlalu jauh dari sekolah.</div>
      <div class="warn-box">📍 Mendekatlah ke lokasi sekolah lalu coba kembali.</div>
      <button class="sheet-btn ghost" onclick="closeSheet()">Tutup</button>
    `;
  } else {
    renderPinSheet(messages[result.reason] || 'Terjadi kesalahan, coba lagi.');
  }
}

function showWaitingScreen(queueId){
  if(unsubWaiting){ unsubWaiting(); unsubWaiting = null; }
  const c = document.getElementById('sheet-content');
  let lastStatus = null;

  unsubWaiting = listenQueueEntry(queueId, (entry)=>{
    if(!entry){
      c.innerHTML = `
        <div class="success-wrap">
          <div class="success-icon">🎉</div>
          <div class="success-title">Penjemputan Selesai</div>
          <div class="success-sub">Anak-anak yang Anda jemput sudah diserahkan.</div>
          <button class="sheet-btn" onclick="closeSheet()">Tutup</button>
        </div>
      `;
      if(unsubWaiting){ unsubWaiting(); unsubWaiting = null; }
      return;
    }

    if(entry.status === 'called' && lastStatus !== 'called'){
      if(navigator.vibrate) navigator.vibrate([250,120,250,120,250]);
      playCallNotifSound();
    }
    lastStatus = entry.status;

    if(entry.status === 'called'){
      c.innerHTML = `
        <div class="success-wrap">
          <div class="success-icon called-icon">🔔</div>
          <div class="success-title">Anak Anda Dipanggil!</div>
          <div class="success-sub">Silakan menuju area gerbang untuk penjemputan.</div>
          <button class="sheet-btn" onclick="closeSheet()">Tutup</button>
        </div>
      `;
    } else {
      c.innerHTML = `
        <div class="success-wrap">
          <div class="success-icon waiting-icon">⏳</div>
          <div class="success-title">Dalam Antrean</div>
          <div class="success-sub">Permintaan penjemputan berhasil. Guru piket akan memanggil nama anak Anda.</div>
          <button class="sheet-btn ghost" onclick="closeSheet()">Tutup jendela</button>
        </div>
      `;
    }
  });
}

/* ---------------- GANTI PIN ---------------- */
window.openChangePin = function openChangePin(id){
  cpStudent = ROSTER.find(s=>s.id===id);
  cpStage = 'current'; cpPin = ''; cpVals = { current:'', new:'', confirm:'' };
  renderChangePinSheet();
  document.getElementById('sheet-overlay').classList.add('open');
}

const CP_LABELS = {
  current: { title: 'Verifikasi PIN Lama', sub: (n)=>`Masukkan PIN lama untuk ${n}` },
  new:     { title: 'Buat PIN Baru',       sub: ()=>'Masukkan 4 digit PIN baru' },
  confirm: { title: 'Konfirmasi PIN Baru', sub: ()=>'Ketik ulang PIN baru untuk konfirmasi' },
};

function renderChangePinSheet(err){
  const c = document.getElementById('sheet-content');
  const { title, sub } = CP_LABELS[cpStage];
  c.innerHTML = `
    <div class="sheet-title">${title}</div>
    <div class="sheet-sub">${sub(cpStudent.name)} (Kelas ${cpStudent.class})</div>
    <div class="pin-dots" id="pin-dots">
      ${[0,1,2,3].map(i=>`<div class="pin-dot ${i<cpPin.length?'filled':''}"></div>`).join('')}
    </div>
    <div class="pin-error">${err||''}</div>
    <div class="keypad">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" onclick="cpPressKey('${n}')">${n}</button>`).join('')}
      <button class="key func" onclick="closeSheet()">Batal</button>
      <button class="key" onclick="cpPressKey('0')">0</button>
      <button class="key func" onclick="cpBackspace()">⌫</button>
    </div>
  `;
}

window.cpPressKey = function cpPressKey(n){
  warmUpAudio();
  if(cpPin.length>=4) return;
  cpPin += n;
  renderChangePinSheet();
  if(cpPin.length===4) cpAdvance();
}

window.cpBackspace = function cpBackspace(){
  cpPin = cpPin.slice(0,-1);
  renderChangePinSheet();
}

async function cpAdvance(){
  if(cpStage === 'current'){
    cpVals.current = cpPin; cpPin = ''; cpStage = 'new';
    renderChangePinSheet();
    return;
  }
  if(cpStage === 'new'){
    cpVals.new = cpPin; cpPin = ''; cpStage = 'confirm';
    renderChangePinSheet();
    return;
  }
  cpVals.confirm = cpPin;
  if(cpVals.new !== cpVals.confirm){
    cpPin = ''; cpStage = 'new';
    renderChangePinSheet('PIN baru tidak cocok. Silakan ulangi pembuatannya.');
    return;
  }

  const dotsEl = document.getElementById('pin-dots');
  const c = document.getElementById('sheet-content');
  c.style.opacity='.5'; c.style.pointerEvents='none';
  let result;
  try{
    result = await changeFamilyPin(cpStudent.id, cpVals.current, cpVals.new, coords);
  }catch(e){
    c.style.opacity='1'; c.style.pointerEvents='auto';
    cpPin=''; cpStage='current'; cpVals={current:'',new:'',confirm:''};
    renderChangePinSheet('Gagal menghubungi server. Periksa koneksi internet Anda.');
    return;
  }
  c.style.opacity='1'; c.style.pointerEvents='auto';

  if(result.ok){
    c.innerHTML = `
      <div class="success-wrap">
        <div class="success-icon">✓</div>
        <div class="success-title">PIN Berhasil Diganti</div>
        <div class="success-sub">PIN untuk ${cpStudent.name} telah berhasil diperbarui.</div>
        <button class="sheet-btn" onclick="closeSheet(); mode='jemput'; renderBody();">Selesai</button>
      </div>
    `;
    return;
  }

  cpPin=''; cpVals={current:'',new:'',confirm:''};
  if(dotsEl) dotsEl.classList.add('shake');

  if(result.reason === 'locked'){
    c.innerHTML = `
      <div class="sheet-title">Verifikasi terkunci</div>
      <div class="sheet-sub">Terlalu banyak percobaan PIN salah.</div>
      <div class="lockout-box">🔒 Terkunci sementara. Silakan hubungi <b>guru piket</b>.</div>
      <button class="sheet-btn ghost" onclick="closeSheet()">Tutup</button>
    `;
  } else if(result.reason === 'out_of_range'){
    c.innerHTML = `
      <div class="sheet-title">Di luar radius sekolah</div>
      <div class="sheet-sub">Anda harus berada di sekitar sekolah untuk mengganti PIN.</div>
      <div class="warn-box">📍 Mendekatlah ke lokasi sekolah lalu coba lagi.</div>
      <button class="sheet-btn ghost" onclick="closeSheet()">Tutup</button>
    `;
  } else {
    cpStage = 'current';
    renderChangePinSheet(`PIN lama salah. ${result.attemptsLeft!=null ? `Sisa percobaan: ${result.attemptsLeft}.` : ''}`);
  }
}
</script>
</body>
</html>
